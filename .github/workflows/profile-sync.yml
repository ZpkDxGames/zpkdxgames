name: profile-sync

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/profile-sync.yml"

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild responsive profile graphics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TZ: America/Sao_Paulo
        run: python3 scripts/build_profile.py

      - name: Validate generated SVGs
        run: python3 scripts/build_profile.py --check

      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No profile data changed."
            exit 0
          fi
          git commit -m "chore(profile): refresh public snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
