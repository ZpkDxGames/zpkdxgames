name: profile-sync

# Regenerates every dynamic piece of the profile dashboard and commits the result in ONE commit.
#   1. scripts/build_assets.py  -> assets/*.svg  (header, telemetry, footer, banners, loadout)
#   2. lowlighter/metrics       -> metrics/*.svg (isometric calendar, skyline, languages, habits, ...)
#   3. Platane/snk              -> metrics/snake.svg (contribution snake, recoloured to the theme)
# Everything is written to the working tree and committed once at the end, so there are no push races.
#
# Required secret for step 2 (optional - without it the stubs/previous renders are kept):
#   METRICS_TOKEN = classic PAT with scopes: public_repo, read:user, read:org

on:
  schedule:
    - cron: "23 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/profile-sync.yml"

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build custom SVG assets (telemetry, header, footer, banners, loadout)
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || github.token }}
        run: python3 scripts/build_assets.py

      # ---------------------------------------------------------------- lowlighter/metrics
      - name: Metrics - isometric commit calendar
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZpkDxGames
          template: classic
          base: ""
          filename: isocalendar.svg
          output_action: none
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Metrics - GitHub Skyline (3D)
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: ZpkDxGames
          template: classic
          base: ""
          base_skip: yes
          filename: skyline.svg
          output_action: none
          plugin_skyline: yes
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.5

      - name: Metrics - languages (in-depth, Java-heavy friendly)
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZpkDxGames
          template: classic
          base: ""
          filename: languages.svg
          output_action: none
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot, batchfile
          plugin_languages_limit: 6
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5

      - name: Metrics - coding habits
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZpkDxGames
          template: classic
          base: ""
          filename: habits.svg
          output_action: none
          config_timezone: America/Sao_Paulo
          plugin_habits: yes
          plugin_habits_from: 300
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

      - name: Metrics - recent activity
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZpkDxGames
          template: classic
          base: ""
          filename: activity.svg
          output_action: none
          config_timezone: America/Sao_Paulo
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_load: 300
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

      - name: Metrics - achievements
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZpkDxGames
          template: classic
          base: ""
          filename: achievements.svg
          output_action: none
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 12

      - name: Metrics - featured plugin repositories
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZpkDxGames
          template: classic
          base: ""
          filename: repositories.svg
          output_action: none
          plugin_repositories: yes
          plugin_repositories_starred: 6
          plugin_repositories_forks: no
          repositories_skipped: |
            zpkdxgames

      - name: Metrics - lines of code changed
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZpkDxGames
          template: classic
          base: ""
          filename: lines.svg
          output_action: none
          config_timezone: America/Sao_Paulo
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30

      # ---------------------------------------------------------------- snake
      - name: Contribution snake (theme-coloured)
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ZpkDxGames
          outputs: |
            dist/snake.svg?color_snake=#00f0ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#00ff66

      # ---------------------------------------------------------------- collect + commit
      - name: Collect renders into the working tree
        run: |
          shopt -s nullglob
          echo "--- /metrics_renders ---"; sudo ls -la /metrics_renders 2>/dev/null || echo "(empty or missing)"
          for f in /metrics_renders/*.svg; do
            sudo cp "$f" "metrics/$(basename "$f")"
            echo "collected $(basename "$f")"
          done
          if [ -f dist/snake.svg ]; then cp dist/snake.svg metrics/snake.svg; echo "collected snake.svg"; fi
          sudo chown -R "$(id -u):$(id -g)" metrics assets

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets metrics
          if git diff --cached --quiet; then
            echo "Nothing changed - skipping commit."
            exit 0
          fi
          git commit -m "chore(profile): sync telemetry $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
