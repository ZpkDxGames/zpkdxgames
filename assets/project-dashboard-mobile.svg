<path d="M8,-12 L18,-12" fill="none" stroke="#43698a" stroke-width="2" />
<rect x="44" y="-32" width="34" height="29" rx="3" fill="#162e47" stroke="#365a76" />
<path d="M51,-22 L67,-22" fill="none" stroke="#55e1ee" stroke-width="2" />
<path d="M51,-12 L61,-12" fill="none" stroke="#43698a" stroke-width="2" />
<rect x="-42" y="8" width="121" height="7" rx="2" fill="#1b3d59" stroke="none" />
<rect x="-42" y="20" width="121" height="7" rx="2" fill="#1b3d59" stroke="none" />
<rect x="-42" y="32" width="121" height="7" rx="2" fill="#1b3d59" stroke="none" />
<path d="M-25,70 L25,70" fill="none" stroke="#4b91ff" stroke-width="4" />
<path d="M0,59 L0,70" fill="none" stroke="#4b91ff" stroke-width="4" />
<path d="M-63,89 L63,89" fill="none" stroke="#55e1ee" stroke-width="2" class="flow"/>
</g>
<text x="26" y="270" font-size="30" font-weight="600" class="" text-anchor="start" style="fill:#f0f7ff" letter-spacing="-0.7">Plexon Command</text>
<text x="26" y="306" font-size="30" font-weight="600" class="" text-anchor="start" style="fill:#f0f7ff" letter-spacing="-0.7">Center</text>
<text x="26" y="345" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">A responsive operations interface</text>
<text x="26" y="372" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">for server pairing, observability,</text>
<text x="26" y="399" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">and the PlexonPanel control plane.</text>
<rect x="26" y="450" width="126" height="34" rx="7" fill="#112a40" stroke="#28495f" />
