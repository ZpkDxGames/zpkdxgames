<text x="36" y="107" font-size="35" font-weight="600" class="" text-anchor="start" style="fill:#edf4ff" letter-spacing="-1">Plexon Command Center</text>
<text x="36" y="149" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">A responsive operations interface for server</text>
<text x="36" y="178" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">pairing, observability, and the PlexonPanel</text>
