<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Live public engineering metrics">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101625"/><stop offset="1" stop-color="#080B12"/></linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B7CFF"/><stop offset="0.52" stop-color="#54D8E8"/><stop offset="1" stop-color="#67E8A5"/></linearGradient>
  <linearGradient id="cubeA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9B8FFF"/><stop offset="1" stop-color="#5E51D8"/></linearGradient>
  <linearGradient id="cubeB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70E6F0"/><stop offset="1" stop-color="#198CA0"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .eyebrow{font-size:18px;font-weight:700;letter-spacing:1.8px}
  .title{font-size:42px;font-weight:760;letter-spacing:-1.2px}
  .section{font-size:30px;font-weight:740;letter-spacing:-.5px}
  .card-title{font-size:26px;font-weight:720}
  .body{font-size:21px;font-weight:450}
  .small{font-size:18px;font-weight:650;letter-spacing:.8px}
  .metric{font-size:44px;font-weight:760;letter-spacing:-1px}
  .float{animation:float 6s ease-in-out infinite;transform-origin:center}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .dash{stroke-dasharray:10 12;animation:dash 10s linear infinite}
  .bar{transform-box:fill-box;transform-origin:center bottom;animation:rise .85s cubic-bezier(.2,.75,.3,1) both}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-220}}
  @keyframes rise{from{transform:scaleY(.08);opacity:.2}to{transform:scaleY(1);opacity:1}}
  @media(prefers-reduced-motion:reduce){.float,.pulse,.dash,.bar{animation:none!important}}
</style>
<rect x="1" y="1" width="758" height="498" rx="28" fill="url(#bg)" stroke="#26334A"/><path d="M30 472H730" stroke="#26334A" stroke-width="2"/><path d="M30 472H280" stroke="url(#signal)" stroke-width="3" class="dash"/><text x="42" y="58" class="eyebrow" fill="#54D8E8">PUBLIC SIGNAL</text><text x="42" y="99" class="section" fill="#F4F7FB">A readable snapshot,</text><text x="42" y="134" class="section" fill="#F4F7FB">refreshed automatically</text><rect x="42" y="157" width="330" height="122" rx="20" fill="#141D2E" stroke="#26334A"/><rect x="42" y="157" width="6" height="122" rx="3" fill="#8B7CFF"/><circle cx="338" cy="187" r="7" fill="#8B7CFF" class="pulse"/><text x="66" y="196" class="small" fill="#8B7CFF">PUBLIC REPOSITORIES</text><text x="66" y="240" class="metric" fill="#F4F7FB">32</text><text x="66" y="265" class="small" fill="#A9B4C8">Owned public codebases</text><rect x="386" y="157" width="330" height="122" rx="20" fill="#141D2E" stroke="#26334A"/><rect x="386" y="157" width="6" height="122" rx="3" fill="#54D8E8"/><circle cx="682" cy="187" r="7" fill="#54D8E8" class="pulse"/><text x="410" y="196" class="small" fill="#54D8E8">JVM REPOSITORIES</text><text x="410" y="240" class="metric" fill="#F4F7FB">22</text><text x="410" y="265" class="small" fill="#A9B4C8">Java and Kotlin codebases</text><rect x="42" y="299" width="330" height="122" rx="20" fill="#141D2E" stroke="#26334A"/><rect x="42" y="299" width="6" height="122" rx="3" fill="#67E8A5"/><circle cx="338" cy="329" r="7" fill="#67E8A5" class="pulse"/><text x="66" y="338" class="small" fill="#67E8A5">PUBLIC COMMITS</text><text x="66" y="382" class="metric" fill="#F4F7FB">3.4k</text><text x="66" y="407" class="small" fill="#A9B4C8">Lifetime contribution history</text><rect x="386" y="299" width="330" height="122" rx="20" fill="#141D2E" stroke="#26334A"/><rect x="386" y="299" width="6" height="122" rx="3" fill="#FFC857"/><circle cx="682" cy="329" r="7" fill="#FFC857" class="pulse"/><text x="410" y="338" class="small" fill="#FFC857">CURRENT STREAK</text><text x="410" y="382" class="metric" fill="#F4F7FB">5d</text><text x="410" y="407" class="small" fill="#A9B4C8">Consecutive active days</text><text x="42" y="462" class="small" fill="#69758A">PUBLIC DATA · AUTOMATIC REFRESH · NO MANUAL COUNTERS</text></svg>