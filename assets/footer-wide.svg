<svg xmlns="http://www.w3.org/2000/svg" width="900" height="115" viewBox="0 0 900 115" role="img" aria-labelledby="title desc">
<title id="title">Let&#x27;s build something useful</title><desc id="desc">Explore the source. Follow the build.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111e31"/><stop offset=".55" stop-color="#080e1a"/><stop offset="1" stop-color="#102337"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#5698ff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#255795"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#2386b5" stop-opacity=".17"/><stop offset="1" stop-color="#2386b5" stop-opacity="0"/></radialGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203c58"/><stop offset="1" stop-color="#112238"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22364f" stop-opacity=".75"/><stop offset="1" stop-color="#0b1526" stop-opacity=".9"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57829d" stop-opacity=".7"/><stop offset=".5" stop-color="#25364d"/><stop offset="1" stop-color="#315570"/></linearGradient>
  <radialGradient id="sphere" cx=".3" cy=".2" r=".8"><stop stop-color="#e0fbff"/><stop offset=".3" stop-color="#67e8f9"/><stop offset="1" stop-color="#2064a3"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 H 0 V 32" fill="none" stroke="#1d3753" stroke-width=".65"/></pattern>
  <clipPath id="panel"><rect x="1" y="1" width="898" height="113" rx="18"/></clipPath>
</defs>
<style>
text{font-family:Arial,'Helvetica Neue',sans-serif;fill:#edf4ff;}
.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:.7px;}
.spin{transform-box:fill-box;transform-origin:center;animation:orbit 48s linear infinite;}
.flow{stroke-dasharray:28 180;animation:flow 8s linear infinite;}
.soft{animation:soft 5s ease-in-out infinite;}
.float{animation:float 6s ease-in-out infinite;}
@keyframes orbit{to{transform:rotate(360deg);}}
@keyframes flow{to{stroke-dashoffset:-416;}}
@keyframes soft{0%,100%{opacity:.45;}50%{opacity:1;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@media (prefers-reduced-motion:reduce){.spin,.flow,.soft,.float{animation:none;}}
</style>
<rect x="1" y="1" width="898" height="113" rx="18" fill="url(#bg)" stroke="url(#edge)"/>
<g clip-path="url(#panel)"><rect width="900" height="115" fill="url(#grid)" opacity=".045"/>
<ellipse cx="819.0" cy="0" rx="423.0" ry="101.2" fill="url(#aura)"/>
<path d="M24,1 H225" stroke="url(#accent)" stroke-opacity=".7"/>
<path d="M24,114 H876" stroke="#15293c"/>
</g>
<text x="36" y="49" font-size="30" font-weight="600" class="" text-anchor="start" style="fill:#edf4ff" letter-spacing="-0.5">Let&#x27;s build something useful.</text>
<text x="36" y="83" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Explore the source. Follow the build.</text>
<path d="M682,58 L848,58" fill="none" stroke="#315371" stroke-width="2" />
<path d="M682,58 L848,58" fill="none" stroke="#67e8f9" stroke-width="2.5" class="flow"/>
<path d="M835,44 L850,58 L835,72" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
</svg>
