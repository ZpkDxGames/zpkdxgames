<circle cx="185.16230366492147" cy="202" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="1" data-count="315" data-cap="764"/>
<text x="374" y="208" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">315</text>
