<circle cx="272.1151832460733" cy="164" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="0" data-count="661" data-cap="764"/>
<text x="374" y="170" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">661</text>
