<circle cx="221.09947643979058" cy="278" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="3" data-count="458" data-cap="764"/>
<text x="374" y="284" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">458</text>
<text x="46" y="322" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Fri</text>
