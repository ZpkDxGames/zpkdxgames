<circle cx="273.62303664921467" cy="316" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="4" data-count="667" data-cap="764"/>
<text x="374" y="322" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">667</text>
<text x="46" y="360" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Sat</text>
<path d="M106,354 L298,354" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="297.24607329842934" cy="354" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="5" data-count="761" data-cap="764"/>
<text x="374" y="360" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#67e8f9">761</text>
<text x="46" y="398" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Sun</text>
<path d="M106,392 L298,392" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="243.717277486911" cy="392" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="6" data-count="548" data-cap="764"/>
<text x="374" y="398" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">548</text>
<text x="26" y="468" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Each dot = a weekday total.</text>
<text x="26" y="499" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Contributions, not hours worked.</text>
</svg>
