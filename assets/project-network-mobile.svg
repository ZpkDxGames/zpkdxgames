<text x="26" y="287" font-size="30" font-weight="600" class="" text-anchor="start" style="fill:#f0f7ff" letter-spacing="-0.7">Neural Core</text>
<text x="26" y="326" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">A personal knowledge network for</text>
<text x="26" y="353" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">conversation archives, with an</text>
<text x="26" y="380" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">interactive 3D graph and</text>
