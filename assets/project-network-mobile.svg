<circle cx="95" cy="22" r="12" fill="#67e8f9" stroke="none" stroke-width="1" opacity=".12" filter="url(#glow)"/>
<circle cx="95" cy="22" r="7" fill="url(#sphere)" stroke="#81d8ee" stroke-width="0.7" />
<circle cx="0" cy="0" r="25" fill="none" stroke="#67e8f9" stroke-width="1" class="soft" opacity=".4"/>
</g>
<text x="26" y="309" font-size="32" font-weight="600" class="" text-anchor="start" style="fill:#edf4ff" letter-spacing="-0.8">Neural Core</text>
<text x="26" y="350" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">A personal knowledge network for</text>
