<circle cx="0" cy="0" r="25" fill="none" stroke="#67e8f9" stroke-width="1" class="soft" opacity=".4"/>
</g>
<text x="26" y="318" font-size="32" font-weight="600" class="" text-anchor="start" style="fill:#edf4ff" letter-spacing="-0.8">Neural Core</text>
<text x="26" y="358" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">A personal knowledge network for</text>
<text x="26" y="385" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">conversation archives, with an</text>
<text x="26" y="412" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">interactive 3D graph and</text>
<text x="26" y="439" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">browser-local storage.</text>
