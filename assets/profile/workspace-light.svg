<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Tonim / ZpkDxGames — public project showcase</title>
  <desc id="desc">Code with purpose. Worlds with character. Minecraft systems and web experiences. An animated isometric voxel represents the Plexon ecosystem. Decorative artwork; no live status is implied.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087e98" stop-opacity=".32"/><stop offset="1" stop-color="#087e98" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#087e98"/><stop offset="1" stop-color="#168361"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6e3f2" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#f5f9ff;stroke:#d6e3f2}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .grow {transform-box:fill-box;transform-origin:left center;animation:grow 1.3s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes grow {from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.grow,.flow,.pulse{animation:none!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="999" height="459" rx="22"/>

    <style>
      .showcase-float {animation:showcase-float 7s ease-in-out infinite}
      .showcase-orbit {animation:showcase-orbit 36s linear infinite}
      .showcase-trace {stroke-dasharray:36 90;animation:showcase-trace 12s linear infinite}
      .showcase-glow {opacity:.8;animation:showcase-glow 6s ease-in-out infinite}
      @keyframes showcase-float {50%{transform:translateY(-7px)}}
      @keyframes showcase-orbit {to{transform:rotate(360deg)}}
      @keyframes showcase-trace {to{stroke-dashoffset:-252}}
      @keyframes showcase-glow {50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce) {
        .showcase-float,.showcase-orbit,.showcase-trace,.showcase-glow {animation:none!important}
      }
    </style>

    <defs>
      <radialGradient id="halo">
        <stop stop-color="#087e98" stop-opacity=".2"/>
        <stop offset="1" stop-color="#087e98" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="cover-clip"><rect width="100%" height="100%" rx="22"/></clipPath>
    </defs>
    <g clip-path="url(#cover-clip)"><circle cx="798" cy="229" r="270" fill="url(#halo)"/><rect x="615" y="60" width="600" height="460" fill="url(#grid)" opacity=".55"/></g><text x="50" y="44" font-size="15" font-weight="750" fill="#087e98" letter-spacing="3">ZPKDXGAMES</text><text x="950" y="44" font-size="11" font-weight="600" fill="#516980" text-anchor="end" letter-spacing="1.4">PUBLIC PROJECTS / PORTFOLIO</text><text x="47" y="145" font-size="86" font-weight="800" fill="#183149" letter-spacing="-4">TONIM</text><text x="50" y="211" font-size="43" font-weight="700" fill="#183149" letter-spacing="-1.6">Code with purpose.</text><text x="50" y="264" font-size="43" font-weight="700" fill="#087e98" letter-spacing="-1.6">Worlds with character.</text><text x="51" y="311" font-size="19" font-weight="400" fill="#516980" >Minecraft systems &amp; web experiences.</text><circle cx="798" cy="229" r="153" fill="none" stroke="#d6e3f2"/><circle cx="798" cy="229" r="128" fill="none" stroke="#d6e3f2" stroke-dasharray="2 10"/><g transform="translate(798 229)"><g class="showcase-orbit"><circle r="153" fill="none" stroke="#087e98" stroke-width="2" stroke-dasharray="55 900"/><circle cx="153" r="5" fill="#168361"/></g></g><g transform="translate(798 229)"><g class="showcase-float"><path d="M0 -84L84 -42.0V42.0L0 84L-84 42.0V-42.0Z" fill="#ffffff" stroke="#087e98" stroke-width="2"/><path d="M0 -84L84 -42.0L0 0L-84 -42.0Z" fill="url(#line)" opacity=".24"/><path d="M0 0L84 -42.0V42.0L0 84Z" fill="#526eb5" opacity=".13"/><path d="M-84 -42.0L0 0L84 -42.0M0 0V84" fill="none" stroke="#087e98" stroke-width="2"/><path d="M-47.879999999999995 -59.64L36.96 -16.8V58.8" fill="none" stroke="#168361" stroke-width="2.5"/></g></g><rect x="678" y="141" width="12" height="12" rx="3" fill="#ffffff" stroke="#168361"/><rect x="920" y="312" width="12" height="12" rx="3" fill="#ffffff" stroke="#526eb5"/><rect x="914" y="129" width="12" height="12" rx="3" fill="#ffffff" stroke="#087e98"/><path d="M620 355H671L700 326" fill="none" stroke="#d6e3f2" stroke-width="2"/><path class="showcase-trace" d="M620 355H671L700 326" fill="none" stroke="#168361" stroke-width="2"/><text x="798" y="415" font-size="11" font-weight="600" fill="#516980" text-anchor="middle" letter-spacing="1.8">THE PLEXON ECOSYSTEM</text><rect x="50" y="365" width="155" height="34" rx="9" fill="#ffffff" stroke="#d6e3f2"/><text x="127.5" y="387" font-size="11" font-weight="650" fill="#087e98" text-anchor="middle" letter-spacing="1">JAVA + PAPER</text><rect x="215" y="365" width="121" height="34" rx="9" fill="#ffffff" stroke="#d6e3f2"/><text x="275.5" y="387" font-size="11" font-weight="650" fill="#526eb5" text-anchor="middle" letter-spacing="1">WEB + UI</text><rect x="346" y="365" width="110" height="34" rx="9" fill="#ffffff" stroke="#d6e3f2"/><text x="401.0" y="387" font-size="11" font-weight="650" fill="#168361" text-anchor="middle" letter-spacing="1">PLEXON</text><text x="51" y="434" font-size="10" font-weight="550" fill="#516980" letter-spacing="1.4">CONFIGURABLE SYSTEMS. EXPRESSIVE INTERFACES.</text>
</svg>
