<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-labelledby="title desc">
  <title id="title">Plexon player journeys illustration</title>
  <desc id="desc">Conceptual project illustration, not a screenshot or measured data.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#68e1f4" stop-opacity=".32"/><stop offset="1" stop-color="#68e1f4" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#68e1f4"/><stop offset="1" stop-color="#6be5bb"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3650" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#0d111c;stroke:#2b3650}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .grow {transform-box:fill-box;transform-origin:left center;animation:grow 1.3s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes grow {from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.grow,.flow,.pulse{animation:none!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="459" height="199" rx="18"/>
  <path d="M24 1H110" stroke="#68e1f4" stroke-width="2" opacity=".8"/>

    <style>
      .showcase-float {animation:showcase-float 7s ease-in-out infinite}
      .showcase-orbit {animation:showcase-orbit 36s linear infinite}
      .showcase-trace {stroke-dasharray:36 90;animation:showcase-trace 12s linear infinite}
      .showcase-glow {opacity:.8;animation:showcase-glow 6s ease-in-out infinite}
      @keyframes showcase-float {50%{transform:translateY(-7px)}}
      @keyframes showcase-orbit {to{transform:rotate(360deg)}}
      @keyframes showcase-trace {to{stroke-dashoffset:-252}}
      @keyframes showcase-glow {50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce) {
        .showcase-float,.showcase-orbit,.showcase-trace,.showcase-glow {animation:none!important}
      }
    </style>
    <rect x="16" y="16" width="428" height="168" rx="10" fill="url(#grid)"/><text x="24" y="34" font-size="11" font-weight="650" fill="#b2a0ff" letter-spacing="1.6">03 / PLAYER JOURNEYS</text><path d="M102 112H358" stroke="#2b3650" stroke-width="2"/><path class="showcase-trace" d="M102 112H358" stroke="#b2a0ff" stroke-width="2"/><rect x="103" y="67" width="70" height="91" rx="9" fill="#151c2e" stroke="#2b3650"/><circle cx="138" cy="94" r="12" fill="#0d111c" stroke="#b2a0ff"/><path d="M132 94l4 4 8-9" fill="none" stroke="#6be5bb" stroke-width="2"/><path d="M119 123h38M119 134h25" stroke="#a5b2cc" stroke-opacity=".5" stroke-width="3"/><rect x="190" y="67" width="70" height="91" rx="9" fill="#151c2e" stroke="#2b3650"/><circle cx="225" cy="94" r="12" fill="#0d111c" stroke="#b2a0ff"/><path d="M219 94l4 4 8-9" fill="none" stroke="#6be5bb" stroke-width="2"/><path d="M206 123h38M206 134h25" stroke="#a5b2cc" stroke-opacity=".5" stroke-width="3"/><rect x="277" y="67" width="70" height="91" rx="9" fill="#151c2e" stroke="#2b3650"/><circle cx="312" cy="94" r="12" fill="#0d111c" stroke="#b2a0ff"/><path d="M306 94l4 4 8-9" fill="none" stroke="#6be5bb" stroke-width="2"/><path d="M293 123h38M293 134h25" stroke="#a5b2cc" stroke-opacity=".5" stroke-width="3"/>
</svg>
