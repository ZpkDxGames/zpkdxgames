<svg xmlns="http://www.w3.org/2000/svg" width="600" height="644" viewBox="0 0 600 644" role="img" aria-labelledby="title desc">
  <title id="title">Tonim / ZpkDxGames — public project showcase</title>
  <desc id="desc">Code with purpose. Worlds with character. Minecraft systems and web experiences. An animated isometric voxel represents the Plexon ecosystem. Decorative artwork; no live status is implied.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#40d6ee" stop-opacity=".32"/><stop offset="1" stop-color="#40d6ee" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#40d6ee"/><stop offset="1" stop-color="#66e2bb"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22354b" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#0b111b;stroke:#22354b}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.flow,.pulse{animation:none!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="599" height="643" rx="22"/>

    <style>
      .showcase-float {animation:showcase-float 7s ease-in-out infinite}
      .showcase-orbit {animation:showcase-orbit 36s linear infinite}
      .showcase-trace {stroke-dasharray:36 90;animation:showcase-trace 12s linear infinite}
      .showcase-glow {opacity:.8;animation:showcase-glow 6s ease-in-out infinite}
      @keyframes showcase-float {50%{transform:translateY(-7px)}}
      @keyframes showcase-orbit {to{transform:rotate(360deg)}}
      @keyframes showcase-trace {to{stroke-dashoffset:-252}}
      @keyframes showcase-glow {50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce) {
        .showcase-float,.showcase-orbit,.showcase-trace,.showcase-glow {animation:none!important}
      }
    </style>

    <defs>
      <radialGradient id="halo">
        <stop stop-color="#40d6ee" stop-opacity=".2"/>
        <stop offset="1" stop-color="#40d6ee" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="cover-clip"><rect width="100%" height="100%" rx="22"/></clipPath>
    </defs>
    <g clip-path="url(#cover-clip)"><circle cx="300" cy="453" r="270" fill="url(#halo)"/><rect x="0" y="60" width="600" height="644" fill="url(#grid)" opacity=".55"/></g><text x="40" y="44" font-size="15" font-weight="750" fill="#40d6ee" letter-spacing="3">ZPKDXGAMES</text><text x="37" y="145" font-size="82" font-weight="800" fill="#edf5ff" letter-spacing="-4">TONIM</text><text x="40" y="211" font-size="37" font-weight="700" fill="#edf5ff" letter-spacing="-1.6">Code with purpose.</text><text x="40" y="264" font-size="37" font-weight="700" fill="#40d6ee" letter-spacing="-1.6">Worlds with character.</text><text x="41" y="311" font-size="19" font-weight="400" fill="#9fb2c9" >Minecraft systems &amp; web experiences.</text><circle cx="300" cy="453" r="128" fill="none" stroke="#22354b"/><circle cx="300" cy="453" r="103" fill="none" stroke="#22354b" stroke-dasharray="2 10"/><g transform="translate(300 453)"><g class="showcase-orbit"><circle r="128" fill="none" stroke="#40d6ee" stroke-width="2" stroke-dasharray="55 900"/><circle cx="128" r="5" fill="#66e2bb"/></g></g><g transform="translate(300 453)"><g class="showcase-float"><path d="M0 -73L73 -36.5V36.5L0 73L-73 36.5V-36.5Z" fill="#111c2b" stroke="#40d6ee" stroke-width="2"/><path d="M0 -73L73 -36.5L0 0L-73 -36.5Z" fill="url(#line)" opacity=".24"/><path d="M0 0L73 -36.5V36.5L0 73Z" fill="#9db7ff" opacity=".13"/><path d="M-73 -36.5L0 0L73 -36.5M0 0V73" fill="none" stroke="#40d6ee" stroke-width="2"/><path d="M-41.61 -51.83L32.12 -14.600000000000001V51.099999999999994" fill="none" stroke="#66e2bb" stroke-width="2.5"/></g></g><rect x="180" y="365" width="12" height="12" rx="3" fill="#111c2b" stroke="#66e2bb"/><rect x="422" y="536" width="12" height="12" rx="3" fill="#111c2b" stroke="#9db7ff"/><rect x="416" y="353" width="12" height="12" rx="3" fill="#111c2b" stroke="#40d6ee"/><rect x="90" y="592" width="155" height="34" rx="9" fill="#111c2b" stroke="#22354b"/><text x="167.5" y="614" font-size="11" font-weight="650" fill="#40d6ee" text-anchor="middle" letter-spacing="1">JAVA + PAPER</text><rect x="255" y="592" width="121" height="34" rx="9" fill="#111c2b" stroke="#22354b"/><text x="315.5" y="614" font-size="11" font-weight="650" fill="#9db7ff" text-anchor="middle" letter-spacing="1">WEB + UI</text><rect x="386" y="592" width="110" height="34" rx="9" fill="#111c2b" stroke="#22354b"/><text x="441.0" y="614" font-size="11" font-weight="650" fill="#66e2bb" text-anchor="middle" letter-spacing="1">PLEXON</text>
</svg>
