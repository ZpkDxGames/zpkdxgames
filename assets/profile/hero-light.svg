<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Tonim · ZpkDxGames</title>
  <desc id="desc">Java, Paper plugins, and web experiences. Builder of the Plexon ecosystem.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087e98" stop-opacity=".32"/><stop offset="1" stop-color="#087e98" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#087e98"/><stop offset="1" stop-color="#168361"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6e3f2" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#f5f9ff;stroke:#d6e3f2}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.flow,.pulse{animation:none!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="999" height="239" rx="22"/>
  <rect x="600" y="1" width="399" height="238" rx="22" fill="url(#grid)"/><text x="38" y="40" font-size="13" font-weight="650" fill="#087e98" letter-spacing="1.3">ZPKDXGAMES / BUILDER OF THE PLEXON ECOSYSTEM</text><text x="36" y="115" font-size="72" font-weight="750" fill="#183149" letter-spacing="-3">Tonim</text><text x="40" y="155" font-size="22" font-weight="450" fill="#516980" >Thoughtful systems. Playful experiences.</text><text x="40" y="203" font-size="14" font-weight="600" fill="#087e98" letter-spacing="2">JAVA / PAPER / WEB</text><path d="M677 82H729V155H781M729 111H920" fill="none" stroke="#d6e3f2" stroke-width="3"/><path class="flow" d="M677 82H729V155H781M729 111H920" fill="none" stroke="#087e98" stroke-width="2"/><rect x="613" y="52" width="128" height="60" rx="16" fill="#ffffff" stroke="#d6e3f2"/><circle class="pulse" cx="632" cy="82" r="4" fill="#087e98"/><text x="647" y="88" font-size="14" font-weight="650" fill="#087e98" letter-spacing="1">BUILD</text><rect x="782" y="127" width="128" height="60" rx="16" fill="#ffffff" stroke="#d6e3f2"/><circle class="pulse" cx="801" cy="157" r="4" fill="#168361"/><text x="816" y="163" font-size="14" font-weight="650" fill="#168361" letter-spacing="1">REFINE</text><rect x="836" y="30" width="128" height="60" rx="16" fill="#ffffff" stroke="#d6e3f2"/><circle class="pulse" cx="855" cy="60" r="4" fill="#526eb5"/><text x="870" y="66" font-size="14" font-weight="650" fill="#526eb5" letter-spacing="1">SHIP</text>
</svg>
