<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img" aria-labelledby="title desc">
  <title id="title">Tonim / ZpkDxGames — engineering systems, crafting experiences</title>
  <desc id="desc">Minecraft plugins, web interfaces, and automation. Animated circuit artwork is decorative, not live telemetry.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08788e" stop-opacity=".32"/><stop offset="1" stop-color="#08788e" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#08788e"/><stop offset="1" stop-color="#12785b"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6ddef" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#f6f8ff;stroke:#d6ddef}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .grow {transform-box:fill-box;transform-origin:left center;animation:grow 1.3s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes grow {from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.grow,.flow,.pulse{animation:none!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="599" height="689" rx="18"/>
  <path d="M24 1H110" stroke="#08788e" stroke-width="2" opacity=".8"/>

    <style>
      .showcase-float {animation:showcase-float 7s ease-in-out infinite}
      .showcase-orbit {animation:showcase-orbit 36s linear infinite}
      .showcase-trace {stroke-dasharray:36 90;animation:showcase-trace 12s linear infinite}
      .showcase-glow {opacity:.8;animation:showcase-glow 6s ease-in-out infinite}
      @keyframes showcase-float {50%{transform:translateY(-7px)}}
      @keyframes showcase-orbit {to{transform:rotate(360deg)}}
      @keyframes showcase-trace {to{stroke-dashoffset:-252}}
      @keyframes showcase-glow {50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce) {
        .showcase-float,.showcase-orbit,.showcase-trace,.showcase-glow {animation:none!important}
      }
    </style>
    <defs><radialGradient id="halo"><stop stop-color="#7051c1" stop-opacity=".2"/><stop offset="1" stop-color="#7051c1" stop-opacity="0"/></radialGradient></defs><circle cx="300" cy="488" r="195" fill="url(#halo)"/><rect x="18" y="335" width="564" height="300" rx="16" fill="url(#grid)"/><text x="32" y="39" font-size="12" font-weight="650" fill="#08788e" letter-spacing="1.8">ZPKDXGAMES / DEVELOPER PROFILE</text><text x="29" y="126" font-size="84" font-weight="800" fill="#18233e" letter-spacing="-4">Tonim.</text><text x="32" y="182" font-size="36" font-weight="700" fill="#18233e" letter-spacing="-1.4">Engineering systems.</text><text x="32" y="228" font-size="36" font-weight="700" fill="#7051c1" letter-spacing="-1.4">Crafting experiences.</text><text x="32" y="267" font-size="17" font-weight="400" fill="#53637e" >Minecraft plugins. Web interfaces. Useful tools.</text><rect x="32" y="296" width="154" height="31" rx="7" fill="#ffffff" stroke="#d6ddef"/><text x="109" y="316" font-size="11" font-weight="600" fill="#08788e" text-anchor="middle" letter-spacing="1">JAVA / PAPER</text><rect x="198" y="296" width="154" height="31" rx="7" fill="#ffffff" stroke="#d6ddef"/><text x="275" y="316" font-size="11" font-weight="600" fill="#7051c1" text-anchor="middle" letter-spacing="1">WEB / UI</text><rect x="364" y="296" width="154" height="31" rx="7" fill="#ffffff" stroke="#d6ddef"/><text x="441" y="316" font-size="11" font-weight="600" fill="#12785b" text-anchor="middle" letter-spacing="1">AUTOMATION</text><g transform="translate(300 488)"><circle r="121" fill="none" stroke="#d6ddef"/><circle r="101" fill="none" stroke="#d6ddef" stroke-dasharray="2 9"/><g class="showcase-orbit"><circle r="121" fill="none" stroke="#7051c1" stroke-width="2" stroke-dasharray="95 665"/><circle cx="121" r="4" fill="#08788e"/></g><g class="showcase-float"><path d="M0-76L66-38V38L0 76L-66 38V-38Z" fill="#ffffff" stroke="#7051c1" stroke-width="2"/><path d="M0-58L50-29V29L0 58L-50 29V-29Z" fill="none" stroke="#d6ddef"/><path d="M-25 22L-45 0L-25-22M25-22L45 0L25 22M10-28L-10 28" fill="none" stroke="#08788e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M211 390L300 488" fill="none" stroke="#d6ddef"/><path class="showcase-trace" d="M211 390L300 488" fill="none" stroke="#08788e" stroke-opacity=".5"/><rect x="175" y="378" width="76" height="25" rx="6" fill="#ffffff" stroke="#d6ddef"/><text x="213" y="395" font-size="10" font-weight="650" fill="#08788e" text-anchor="middle" letter-spacing="1.4">BUILD</text><path d="M406 417L300 488" fill="none" stroke="#d6ddef"/><path class="showcase-trace" d="M406 417L300 488" fill="none" stroke="#7051c1" stroke-opacity=".5"/><rect x="370" y="405" width="76" height="25" rx="6" fill="#ffffff" stroke="#d6ddef"/><text x="408" y="422" font-size="10" font-weight="650" fill="#7051c1" text-anchor="middle" letter-spacing="1.4">CRAFT</text><path d="M210 595L300 488" fill="none" stroke="#d6ddef"/><path class="showcase-trace" d="M210 595L300 488" fill="none" stroke="#12785b" stroke-opacity=".5"/><rect x="174" y="583" width="76" height="25" rx="6" fill="#ffffff" stroke="#d6ddef"/><text x="212" y="600" font-size="10" font-weight="650" fill="#12785b" text-anchor="middle" letter-spacing="1.4">SHIP</text><path d="M32 632H568" stroke="#d6ddef"/><text x="32" y="655" font-size="10" font-weight="600" fill="#53637e" letter-spacing="1.5">01 / IDEAS INTO INTERFACES</text><text x="568" y="655" font-size="10" font-weight="600" fill="#7051c1" text-anchor="end" letter-spacing="1.2">THE PLEXON ECOSYSTEM</text>
</svg>
