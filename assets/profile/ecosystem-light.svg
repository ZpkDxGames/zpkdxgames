<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="title desc">
  <title id="title">Project momentum and source language mix</title>
  <desc id="desc">Commit counts by public project and GitHub Linguist source bytes. Exact values are available in data/profile.json.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087e98" stop-opacity=".32"/><stop offset="1" stop-color="#087e98" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#087e98"/><stop offset="1" stop-color="#168361"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6e3f2" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#f5f9ff;stroke:#d6e3f2}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .grow {transform-box:fill-box;transform-origin:left center;animation:grow 1.3s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes grow {from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.grow,.flow,.pulse{animation:none!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="999" height="443" rx="22"/>
  <text x="32" y="36" font-size="13" font-weight="650" fill="#087e98" letter-spacing="1.8">WHERE THE WORK HAPPENS</text><text x="32" y="72" font-size="26" font-weight="700" fill="#183149" >Project momentum</text><text x="32" y="99" font-size="14" font-weight="400" fill="#516980" >Most active public projects · last 90 days</text><text x="545" y="72" font-size="26" font-weight="700" fill="#183149" >Source language mix</text><text x="545" y="99" font-size="14" font-weight="400" fill="#516980" >Code bytes · public default branches</text><path d="M510 46V391" stroke="#d6e3f2"/><text x="32" y="137" font-size="14" font-weight="550" fill="#183149" >PlexonPanel-Dashboard</text><text x="475" y="137" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">237</text><rect x="32" y="146" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="146" width="442.0" height="7" rx="3" fill="#087e98" class="grow" style="animation-delay:0.0s"/><text x="32" y="180" font-size="14" font-weight="550" fill="#183149" >PlexonCrates</text><text x="475" y="180" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">201</text><rect x="32" y="189" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="189" width="374.86" height="7" rx="3" fill="#087e98" class="grow" style="animation-delay:0.1s"/><text x="32" y="223" font-size="14" font-weight="550" fill="#183149" >PlexonQuests</text><text x="475" y="223" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">194</text><rect x="32" y="232" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="232" width="361.81" height="7" rx="3" fill="#087e98" class="grow" style="animation-delay:0.2s"/><text x="32" y="266" font-size="14" font-weight="550" fill="#183149" >PlexonTools</text><text x="475" y="266" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">146</text><rect x="32" y="275" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="275" width="272.29" height="7" rx="3" fill="#087e98" class="grow" style="animation-delay:0.3s"/><text x="32" y="309" font-size="14" font-weight="550" fill="#183149" >PlexonSpawners</text><text x="475" y="309" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">136</text><rect x="32" y="318" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="318" width="253.64" height="7" rx="3" fill="#087e98" class="grow" style="animation-delay:0.4s"/><text x="32" y="352" font-size="14" font-weight="550" fill="#183149" >PlexonPanel</text><text x="475" y="352" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">120</text><rect x="32" y="361" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="361" width="223.8" height="7" rx="3" fill="#087e98" class="grow" style="animation-delay:0.5s"/><circle cx="628" cy="229" r="66" fill="none" stroke="#ffffff" stroke-width="20"/><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#087e98" stroke-width="20" stroke-dasharray="357.4378 414.6902" stroke-dashoffset="0.0000" transform="rotate(-90 628 229)"><title>Java: 5,698,027 bytes</title></circle><circle cx="734" cy="155" r="4.5" fill="#087e98"/><text x="746" y="160" font-size="14" font-weight="550" fill="#183149" >Java</text><text x="968" y="160" font-size="14" font-weight="400" fill="#516980" text-anchor="end">86.2%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#168361" stroke-width="20" stroke-dasharray="34.5381 414.6902" stroke-dashoffset="-357.4378" transform="rotate(-90 628 229)"><title>TypeScript: 550,583 bytes</title></circle><circle cx="734" cy="194" r="4.5" fill="#168361"/><text x="746" y="199" font-size="14" font-weight="550" fill="#183149" >TypeScript</text><text x="968" y="199" font-size="14" font-weight="400" fill="#516980" text-anchor="end">8.3%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#526eb5" stroke-width="20" stroke-dasharray="13.4736 414.6902" stroke-dashoffset="-391.9759" transform="rotate(-90 628 229)"><title>CSS: 214,787 bytes</title></circle><circle cx="734" cy="233" r="4.5" fill="#526eb5"/><text x="746" y="238" font-size="14" font-weight="550" fill="#183149" >CSS</text><text x="968" y="238" font-size="14" font-weight="400" fill="#516980" text-anchor="end">3.2%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#a16a14" stroke-width="20" stroke-dasharray="7.2853 414.6902" stroke-dashoffset="-405.4495" transform="rotate(-90 628 229)"><title>JavaScript: 116,137 bytes</title></circle><circle cx="734" cy="272" r="4.5" fill="#a16a14"/><text x="746" y="277" font-size="14" font-weight="550" fill="#183149" >JavaScript</text><text x="968" y="277" font-size="14" font-weight="400" fill="#516980" text-anchor="end">1.8%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#516980" stroke-width="20" stroke-dasharray="1.9554 414.6902" stroke-dashoffset="-412.7348" transform="rotate(-90 628 229)"><title>Other: 31,172 bytes</title></circle><circle cx="734" cy="311" r="4.5" fill="#516980"/><text x="746" y="316" font-size="14" font-weight="550" fill="#183149" >Other</text><text x="968" y="316" font-size="14" font-weight="400" fill="#516980" text-anchor="end">0.5%</text><text x="628" y="226" font-size="34" font-weight="700" fill="#183149" text-anchor="middle">7</text><text x="628" y="250" font-size="13" font-weight="400" fill="#516980" text-anchor="middle">languages</text><text x="545" y="350" font-size="15" font-weight="400" fill="#516980" >6,610.7 kB of source</text><text x="545" y="373" font-size="12" font-weight="400" fill="#516980" >Language share is not a skill rating.</text><text x="32" y="418" font-size="12" font-weight="400" fill="#516980" >Forks, archived projects, private repositories, and profile automation are excluded.</text>
</svg>
