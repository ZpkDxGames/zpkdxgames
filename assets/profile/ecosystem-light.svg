exonTools</text><text x="475" y="309" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">24</text><rect x="32" y="318" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="318" width="156.0" height="7" rx="3" fill="#087e98" class="rise"/><text x="32" y="352" font-size="14" font-weight="550" fill="#183149" >PlexonGriefPreventionAddon</text><text x="475" y="352" font-size="14" font-weight="650" fill="#087e98" text-anchor="end">9</text><rect x="32" y="361" width="442" height="7" rx="3" fill="#ffffff" /><rect x="32" y="361" width="58.5" height="7" rx="3" fill="#087e98" class="rise"/><circle cx="628" cy="229" r="66" fill="none" stroke="#ffffff" stroke-width="20"/><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#087e98" stroke-width="20" stroke-dasharray="411.0764 414.6902" stroke-dashoffset="0.0000" transform="rotate(-90 628 229)"><title>Java: 2,529,693 bytes</title></circle><circle cx="734" cy="155" r="4.5" fill="#087e98"/><text x="746" y="160" font-size="14" font-weight="550" fill="#183149" >Java</text><text x="968" y="160" font-size="14" font-weight="400" fill="#516980" text-anchor="end">99.1%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#168361" stroke-width="20" stroke-dasharray="2.1881 414.6902" stroke-dashoffset="-411.0764" transform="rotate(-90 628 229)"><title>JavaScript: 13,465 bytes</title></circle><circle cx="734" cy="194" r="4.5" fill="#168361"/><text x="746" y="199" font-size="14" font-weight="550" fill="#183149" >JavaScript</text><text x="968" y="199" font-size="14" font-weight="400" fill="#516980" text-anchor="end">0.5%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#526eb5" stroke-width="20" stroke-dasharray="1.4258 414.6902" stroke-dashoffset="-413.2645" transform="rotate(-90 628 229)"><title>HTML: 8,774 bytes</title></circle><circle cx="734" cy="233" r="4.5" fill="#526eb5"/><text x="746" y="238" font-size="14" font-weight="550" fill="#183149" >HTML</text><text x="968" y="238" font-size="14" font-weight="400" fill="#516980" text-anchor="end">0.3%</text><text x="628" y="226" font-size="34" font-weight="700" fill="#183149" text-anchor="middle">3</text><text x="628" y="250" font-size="13" font-weight="400" fill="#516980" text-anchor="middle">languages</text><text x="545" y="350" font-size="15" font-weight="400" fill="#516980" >2,551.9 kB of source</text><text x="545" y="373" font-size="12" font-weight="400" fill="#516980" >Language share is not a skill rating.</text><text x="32" y="418" font-size="12" font-weight="400" fill="#516980" >Forks, archived projects, private repositories, and profile automation are excluded.</text>
</svg>
