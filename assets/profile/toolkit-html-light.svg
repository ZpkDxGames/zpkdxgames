<svg xmlns="http://www.w3.org/2000/svg" width="76" height="104" viewBox="0 0 76 104" role="img" aria-labelledby="title desc">
  <title id="title">HTML toolkit icon</title>
  <desc id="desc">HTML. Decorative motion; no proficiency rating is implied.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087e98" stop-opacity=".32"/><stop offset="1" stop-color="#087e98" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#087e98"/><stop offset="1" stop-color="#168361"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6e3f2" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#f5f9ff;stroke:#d6e3f2}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .grow {transform-box:fill-box;transform-origin:left center;animation:grow 1.3s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes grow {from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.grow,.flow,.pulse{animation:none!important}}
  </style>
  <style>
      .toolkit-float {animation:toolkit-float 6s ease-in-out infinite;animation-delay:-2.48s}
      @keyframes toolkit-float {50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce) {.toolkit-float{animation:none!important}}
    </style>
    <ellipse cx="38" cy="78" rx="22" ry="2" fill="#516980" opacity=".13"/>
    <g class="toolkit-float"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 256 256" x="6" y="8"><rect width="256" height="256" fill="#E14E1D" rx="60" /><path fill="#fff" d="M48 38L56.6098 134.593H167.32L163.605 176.023L127.959 185.661L92.38 176.037L90.0012 149.435H57.9389L62.5236 200.716L127.951 218.888L193.461 200.716L202.244 102.655H85.8241L82.901 69.9448H205.041H205.139L208 38H48Z" /><path fill="#EBEBEB" d="M128 38H48L56.6098 134.593H128V102.655H85.8241L82.901 69.9448H128V38Z" /><path fill="#EBEBEB" d="M128 185.647L127.959 185.661L92.38 176.037L90.0012 149.435H57.9388L62.5236 200.716L127.951 218.888L128 218.874V185.647Z" /></svg></g><text x="38" y="96" font-size="11.5" font-weight="550" fill="#183149" text-anchor="middle">HTML</text>
</svg>
