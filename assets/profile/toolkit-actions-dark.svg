  <title id="title">GitHub Actions toolkit icon</title>
  <desc id="desc">GitHub Actions. Decorative motion; no proficiency rating is implied.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#40d6ee" stop-opacity=".32"/><stop offset="1" stop-color="#40d6ee" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#40d6ee"/><stop offset="1" stop-color="#66e2bb"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22354b" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#0b111b;stroke:#22354b}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .grow {transform-box:fill-box;transform-origin:left center;animation:grow 1.3s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes grow {from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.grow,.flow,.pulse{animation:none!important}}
  </style>
  <style>
      .toolkit-float {animation:toolkit-float 6s ease-in-out infinite;animation-delay:-1.55s}
      @keyframes toolkit-float {50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce) {.toolkit-float{animation:none!important}}
    </style>
