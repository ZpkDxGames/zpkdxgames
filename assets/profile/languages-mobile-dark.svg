<title id="title">Source-language byte share and project-group comparison</title>
<desc id="desc">As of 2026-10-13, 11,018,100 default-branch bytes. The overall share includes all projects. Repository groups partition server/plugin, web/interface and other projects; a web project may contain backend or native code. Each group is normalized within itself and retains its true byte total. Other groups languages below 1% in that view. Source volume, not proficiency or time spent.</desc>
<style>svg{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif}
