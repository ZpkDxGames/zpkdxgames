<desc id="desc">Conceptual illustration for PlexonChats, not a screenshot. As of 2026-10-13, latest stable in the 90-day snapshot window: 4.0.1; project-wide commits: 259; primary source language by byte volume: Java. Not proficiency or production-readiness evidence.</desc>
<style>svg{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif}
