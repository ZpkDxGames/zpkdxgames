<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-labelledby="title desc">
<title id="title">Six most recent published GitHub releases</title>
<desc id="desc">Window 2026-07-16 to 2026-10-13. Last release 24 days before snapshot. Sorted by actual UTC publication timestamp. PlexonSpawners 4.0.0, 2026-09-19, stable; PlexonUtility 3.5.0, 2026-09-19, stable; PlexonCore 2.1.0, 2026-09-17, stable; PlexonPanel 3.4.0, 2026-09-13, stable; PlexonChats 4.0.1, 2026-09-13, stable; PlexonChats 4.0.0, 2026-09-13, stable. Stable labels reflect the GitHub flag; publication does not certify live deployment.</desc>
<style>svg{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif}
    .reveal{animation:reveal 900ms cubic-bezier(0.22, 1, 0.36, 1) both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 900ms cubic-bezier(0.22, 1, 0.36, 1) both}
    .bar-y{transform-box:fill-box;transform-origin:center bottom;animation:bar-y 900ms cubic-bezier(0.22, 1, 0.36, 1) both}
    .draw{stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 900ms cubic-bezier(0.22, 1, 0.36, 1) both}
    .signal{stroke-dasharray:40 340;animation:signal 24s linear infinite}
    @keyframes reveal{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes bar-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes draw{from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes signal{to{stroke-dashoffset:-760}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0!important}}
    </style>
