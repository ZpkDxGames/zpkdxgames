<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="title desc">
  <title id="title">Project momentum and source language mix</title>
  <desc id="desc">Commit counts by public project and GitHub Linguist source bytes. Exact values are available in data/profile.json.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#40d6ee" stop-opacity=".32"/><stop offset="1" stop-color="#40d6ee" stop-opacity=".01"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#40d6ee"/><stop offset="1" stop-color="#66e2bb"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22354b" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    svg {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .frame {fill:#0b111b;stroke:#22354b}
    .draw {stroke-dasharray:1000.00;stroke-dashoffset:0;animation:draw 1.8s ease-out both}
    .rise {animation:rise .8s ease-out both}
    .fade {animation:fade .8s ease-out both}
    .flow {stroke-dasharray:5 13;animation:flow 12s linear infinite}
    .pulse {animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes draw {from{stroke-dashoffset:1000.00}to{stroke-dashoffset:0}}
    @keyframes rise {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade {from{opacity:0}to{opacity:1}}
    @keyframes flow {to{stroke-dashoffset:-108}}
    @keyframes pulse {50%{opacity:.45;transform:scale(.9)}}
    @media (prefers-reduced-motion:reduce) {.draw,.rise,.fade,.flow,.pulse{animation:none!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="999" height="443" rx="22"/>
  <text x="32" y="36" font-size="13" font-weight="650" fill="#40d6ee" letter-spacing="1.8">WHERE THE WORK HAPPENS</text><text x="32" y="72" font-size="26" font-weight="700" fill="#edf5ff" >Project momentum</text><text x="32" y="99" font-size="14" font-weight="400" fill="#9fb2c9" >Most active public projects · last 90 days</text><text x="545" y="72" font-size="26" font-weight="700" fill="#edf5ff" >Source language mix</text><text x="545" y="99" font-size="14" font-weight="400" fill="#9fb2c9" >Code bytes · public default branches</text><path d="M510 46V391" stroke="#22354b"/><text x="32" y="137" font-size="14" font-weight="550" fill="#edf5ff" >PlexonSpawners</text><text x="475" y="137" font-size="14" font-weight="650" fill="#40d6ee" text-anchor="end">37</text><rect x="32" y="146" width="442" height="7" rx="3" fill="#111c2b" /><rect x="32" y="146" width="442.0" height="7" rx="3" fill="#40d6ee" class="rise"/><text x="32" y="180" font-size="14" font-weight="550" fill="#edf5ff" >Rankup-1.2Fixer</text><text x="475" y="180" font-size="14" font-weight="650" fill="#40d6ee" text-anchor="end">27</text><rect x="32" y="189" width="442" height="7" rx="3" fill="#111c2b" /><rect x="32" y="189" width="322.54" height="7" rx="3" fill="#40d6ee" class="rise"/><text x="32" y="223" font-size="14" font-weight="550" fill="#edf5ff" >PlexonTools</text><text x="475" y="223" font-size="14" font-weight="650" fill="#40d6ee" text-anchor="end">24</text><rect x="32" y="232" width="442" height="7" rx="3" fill="#111c2b" /><rect x="32" y="232" width="286.7" height="7" rx="3" fill="#40d6ee" class="rise"/><text x="32" y="266" font-size="14" font-weight="550" fill="#edf5ff" >PlexonQuests</text><text x="475" y="266" font-size="14" font-weight="650" fill="#40d6ee" text-anchor="end">20</text><rect x="32" y="275" width="442" height="7" rx="3" fill="#111c2b" /><rect x="32" y="275" width="238.92" height="7" rx="3" fill="#40d6ee" class="rise"/><text x="32" y="309" font-size="14" font-weight="550" fill="#edf5ff" >PlexonCrates</text><text x="475" y="309" font-size="14" font-weight="650" fill="#40d6ee" text-anchor="end">11</text><rect x="32" y="318" width="442" height="7" rx="3" fill="#111c2b" /><rect x="32" y="318" width="131.41" height="7" rx="3" fill="#40d6ee" class="rise"/><text x="32" y="352" font-size="14" font-weight="550" fill="#edf5ff" >PlexonPanel</text><text x="475" y="352" font-size="14" font-weight="650" fill="#40d6ee" text-anchor="end">8</text><rect x="32" y="361" width="442" height="7" rx="3" fill="#111c2b" /><rect x="32" y="361" width="95.57" height="7" rx="3" fill="#40d6ee" class="rise"/><circle cx="628" cy="229" r="66" fill="none" stroke="#111c2b" stroke-width="20"/><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#40d6ee" stroke-width="20" stroke-dasharray="410.9824 414.6902" stroke-dashoffset="0.0000" transform="rotate(-90 628 229)"><title>Java: 2,465,014 bytes</title></circle><circle cx="734" cy="155" r="4.5" fill="#40d6ee"/><text x="746" y="160" font-size="14" font-weight="550" fill="#edf5ff" >Java</text><text x="968" y="160" font-size="14" font-weight="400" fill="#9fb2c9" text-anchor="end">99.1%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#66e2bb" stroke-width="20" stroke-dasharray="2.2450 414.6902" stroke-dashoffset="-410.9824" transform="rotate(-90 628 229)"><title>JavaScript: 13,465 bytes</title></circle><circle cx="734" cy="194" r="4.5" fill="#66e2bb"/><text x="746" y="199" font-size="14" font-weight="550" fill="#edf5ff" >JavaScript</text><text x="968" y="199" font-size="14" font-weight="400" fill="#9fb2c9" text-anchor="end">0.5%</text><circle class="fade" cx="628" cy="229" r="66" fill="none" stroke="#9db7ff" stroke-width="20" stroke-dasharray="1.4629 414.6902" stroke-dashoffset="-413.2274" transform="rotate(-90 628 229)"><title>HTML: 8,774 bytes</title></circle><circle cx="734" cy="233" r="4.5" fill="#9db7ff"/><text x="746" y="238" font-size="14" font-weight="550" fill="#edf5ff" >HTML</text><text x="968" y="238" font-size="14" font-weight="400" fill="#9fb2c9" text-anchor="end">0.4%</text><text x="628" y="226" font-size="34" font-weight="700" fill="#edf5ff" text-anchor="middle">3</text><text x="628" y="250" font-size="13" font-weight="400" fill="#9fb2c9" text-anchor="middle">languages</text><text x="545" y="350" font-size="15" font-weight="400" fill="#9fb2c9" >2,487.3 kB of source</text><text x="545" y="373" font-size="12" font-weight="400" fill="#9fb2c9" >Language share is not a skill rating.</text><text x="32" y="418" font-size="12" font-weight="400" fill="#9fb2c9" >Forks, archived projects, private repositories, and profile automation are excluded.</text>
</svg>
