<svg xmlns="http://www.w3.org/2000/svg" width="420" height="410" viewBox="0 0 420 410" role="img" aria-labelledby="title desc">
<title id="title">ZpkDxGames — Tonim&#x27;s developer dashboard</title><desc id="desc">Minecraft systems, developer tools, and local-first interactive apps. Blue and cyan orbital code artwork is decorative.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e35"/><stop offset=".5" stop-color="#070e1d"/><stop offset="1" stop-color="#0d2136"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#4b91ff"/><stop offset="1" stop-color="#55e1ee"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#255795"/><stop offset="1" stop-color="#55e1ee"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#2386b5" stop-opacity=".25"/><stop offset="1" stop-color="#2386b5" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 H 0 V 32" fill="none" stroke="#1d3753" stroke-width=".65"/></pattern>
  <clipPath id="panel"><rect x="1" y="1" width="418" height="408" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f0f7ff;}
.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:.7px;}
.spin{transform-box:fill-box;transform-origin:center;animation:orbit 48s linear infinite;}
.flow{stroke-dasharray:28 180;animation:flow 8s linear infinite;}
.soft{animation:soft 5s ease-in-out infinite;}
.float{animation:float 6s ease-in-out infinite;}
@keyframes orbit{to{transform:rotate(360deg);}}
@keyframes flow{to{stroke-dashoffset:-416;}}
@keyframes soft{0%,100%{opacity:.45;}50%{opacity:1;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@media (prefers-reduced-motion:reduce){.spin,.flow,.soft,.float{animation:none;}}
</style>
<rect x="1" y="1" width="418" height="408" rx="22" fill="url(#bg)" stroke="#223b55"/>
<g clip-path="url(#panel)"><rect width="420" height="410" fill="url(#grid)" opacity=".16"/>
<ellipse cx="382.2" cy="0" rx="197.39999999999998" ry="360.8" fill="url(#aura)"/></g>
<g transform="translate(352,182) scale(0.63)" opacity="0.23">
<circle cx="0" cy="0" r="112" fill="none" stroke="#315477" stroke-width="1.3" />
<circle cx="0" cy="0" r="137" fill="none" stroke="#55e1ee" stroke-width="1" stroke-dasharray="2 20" class="spin" opacity=".55"/>
<path d="M-94,-58 A111,111 0 0 1 75,-81" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" class="soft"/>
<path d="M0,-76 L66,-38 V38 L0,76 L-66,38 V-38 Z" fill="#0f243c" stroke="#4b91ff" stroke-width="2"/>
<path d="M-12,-76 L54,-38 V38 L-12,76" fill="none" stroke="#244963" stroke-width="1"/>
<path d="M-27,-18 L-45,0 L-27,18 M27,-18 L45,0 L27,18 M12,-26 L-12,26" fill="none" stroke="#55e1ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-96,-62 L-54.72,-35.339999999999996" fill="none" stroke="#4b91ff" stroke-width="1.5" />
<circle cx="-96" cy="-62" r="9" fill="#070e1d" stroke="#55e1ee" stroke-width="2" />
<circle cx="-96" cy="-62" r="3" fill="#55e1ee" stroke="none" stroke-width="1" class="soft"/>
<path d="M105,41 L59.849999999999994,23.369999999999997" fill="none" stroke="#4b91ff" stroke-width="1.5" />
<circle cx="105" cy="41" r="9" fill="#070e1d" stroke="#55e1ee" stroke-width="2" />
<circle cx="105" cy="41" r="3" fill="#55e1ee" stroke="none" stroke-width="1" class="soft"/>
<path d="M-41,103 L-23.369999999999997,58.709999999999994" fill="none" stroke="#4b91ff" stroke-width="1.5" />
<circle cx="-41" cy="103" r="9" fill="#070e1d" stroke="#55e1ee" stroke-width="2" />
<circle cx="-41" cy="103" r="3" fill="#55e1ee" stroke="none" stroke-width="1" class="soft"/>
</g>
<text x="26" y="40" font-size="20" font-weight="400" class="mono" text-anchor="start" style="fill:#55e1ee">TONIM / DEVELOPER</text>
<circle cx="380" cy="34" r="5" fill="#55e1ee" stroke="none" stroke-width="1" class="soft"/>
<text x="26" y="100" font-size="43" font-weight="700" class="" text-anchor="start" style="fill:#f0f7ff" letter-spacing="-1.6">ZpkDxGames</text>
<text x="26" y="161" font-size="34" font-weight="600" class="" text-anchor="start" style="fill:#f0f7ff" letter-spacing="-0.8">Minecraft worlds.</text>
<text x="26" y="206" font-size="34" font-weight="600" class="" text-anchor="start" style="fill:#55e1ee" letter-spacing="-0.8">Real-world tools.</text>
<text x="26" y="259" font-size="21" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">Minecraft systems, developer tools</text>
<text x="26" y="290" font-size="21" font-weight="400" class="" text-anchor="start" style="fill:#afc4da">and local-first interactive apps.</text>
<path d="M26,326 L394,326" fill="none" stroke="#223b55" stroke-width="1" />
<text x="26" y="362" font-size="20" font-weight="400" class="mono" text-anchor="start" style="fill:#55e1ee">JAVA / TYPESCRIPT</text>
<text x="26" y="389" font-size="20" font-weight="400" class="mono" text-anchor="start" style="fill:#afc4da">JAVASCRIPT / BRAZIL</text>
</svg>
