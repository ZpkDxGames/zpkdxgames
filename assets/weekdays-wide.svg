<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436" role="img" aria-labelledby="title desc">
<title id="title">Contributions by weekday</title><desc id="desc">Contribution totals grouped by weekday across the same 365-day calendar as the headline metrics. Monday: 655; Tuesday: 315; Wednesday: 417; Thursday: 443; Friday: 658; Saturday: 751; Sunday: 543. Dot positions use a linear scale starting at zero; these are contributions, not hours worked.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111e31"/><stop offset=".55" stop-color="#080e1a"/><stop offset="1" stop-color="#102337"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#5698ff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#255795"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67e8f9" stop-opacity=".19"/><stop offset="1" stop-color="#5698ff" stop-opacity=".015"/></linearGradient>
  <linearGradient id="polish" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".28"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#06101f" stop-opacity=".20"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#2386b5" stop-opacity=".17"/><stop offset="1" stop-color="#2386b5" stop-opacity="0"/></radialGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203c58"/><stop offset="1" stop-color="#112238"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22364f" stop-opacity=".75"/><stop offset="1" stop-color="#0b1526" stop-opacity=".9"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57829d" stop-opacity=".7"/><stop offset=".5" stop-color="#25364d"/><stop offset="1" stop-color="#315570"/></linearGradient>
  <radialGradient id="sphere" cx=".3" cy=".2" r=".8"><stop stop-color="#e0fbff"/><stop offset=".3" stop-color="#67e8f9"/><stop offset="1" stop-color="#2064a3"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 H 0 V 32" fill="none" stroke="#1d3753" stroke-width=".65"/></pattern>
  <clipPath id="panel"><rect x="1" y="1" width="898" height="434" rx="18"/></clipPath>
</defs>
<style>
text{font-family:Arial,'Helvetica Neue',sans-serif;fill:#edf4ff;}
.mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:.7px;}
.spin{transform-box:fill-box;transform-origin:center;animation:orbit 48s linear infinite;}
.flow{stroke-dasharray:28 180;animation:flow 12s linear infinite;}
.trace{stroke-dasharray:70 930;animation:trace 16s linear infinite;}
.halo{animation:halo 7s cubic-bezier(.45,0,.55,1) infinite;}
.reveal{animation:reveal 1.4s cubic-bezier(.22,1,.36,1) both;}
.soft{animation:soft 7s cubic-bezier(.45,0,.55,1) infinite;}
.float{animation:float 8s cubic-bezier(.45,0,.55,1) infinite;}
@keyframes trace{to{stroke-dashoffset:-1000;}}
@keyframes halo{0%,100%{opacity:.2;}50%{opacity:.65;}}
@keyframes reveal{from{opacity:0;}to{opacity:1;}}
@keyframes orbit{to{transform:rotate(360deg);}}
@keyframes flow{to{stroke-dashoffset:-416;}}
@keyframes soft{0%,100%{opacity:.45;}50%{opacity:1;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@media (prefers-reduced-motion:reduce){.spin,.flow,.soft,.float,.trace,.halo,.reveal{animation:none;}}
</style>
<rect x="1" y="1" width="898" height="434" rx="18" fill="url(#bg)" stroke="url(#edge)"/>
<g clip-path="url(#panel)"><rect width="900" height="436" fill="url(#grid)" opacity=".045"/>
<ellipse cx="819.0" cy="0" rx="423.0" ry="383.68" fill="url(#aura)"/>
<path d="M24,1 H225" stroke="url(#accent)" stroke-opacity=".7"/>
<path d="M24,435 H876" stroke="#15293c"/>
</g>
<text x="36" y="43" font-size="26" font-weight="600" class="" text-anchor="start" style="fill:#edf4ff">Activity by weekday</text>
<text x="36" y="76" font-size="18" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Contribution totals · past 365 days</text>
<rect x="36" y="104" width="828" height="264" rx="12" fill="url(#glass)" stroke="url(#edge)" />
<path d="M216,146 L216,356" fill="none" stroke="#30465f" stroke-width="0.8" stroke-dasharray="2 6"/>
<text x="216" y="132" font-size="16" font-weight="400" class="" text-anchor="middle" style="fill:#a5b6cc">0</text>
<path d="M473.0,146 L473.0,356" fill="none" stroke="#30465f" stroke-width="0.8" stroke-dasharray="2 6"/>
<text x="473.0" y="132" font-size="16" font-weight="400" class="" text-anchor="middle" style="fill:#a5b6cc">376</text>
<path d="M730,146 L730,356" fill="none" stroke="#30465f" stroke-width="0.8" stroke-dasharray="2 6"/>
<text x="730" y="132" font-size="16" font-weight="400" class="" text-anchor="middle" style="fill:#a5b6cc">752</text>
<text x="56" y="168" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Monday</text>
<path d="M216,162 L730,162" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="663.6994680851064" cy="162" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="0" data-count="655" data-cap="752"/>
<text x="840" y="168" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">655</text>
<text x="56" y="198" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Tuesday</text>
<path d="M216,192 L730,192" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="431.3058510638298" cy="192" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="1" data-count="315" data-cap="752"/>
<text x="840" y="198" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">315</text>
<text x="56" y="228" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Wednesday</text>
<path d="M216,222 L730,222" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="501.0239361702128" cy="222" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="2" data-count="417" data-cap="752"/>
<text x="840" y="228" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">417</text>
<text x="56" y="258" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Thursday</text>
<path d="M216,252 L730,252" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="518.7952127659574" cy="252" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="3" data-count="443" data-cap="752"/>
<text x="840" y="258" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">443</text>
<text x="56" y="288" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Friday</text>
<path d="M216,282 L730,282" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="665.75" cy="282" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="4" data-count="658" data-cap="752"/>
<text x="840" y="288" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">658</text>
<text x="56" y="318" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Saturday</text>
<path d="M216,312 L730,312" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="729.3164893617021" cy="312" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="5" data-count="751" data-cap="752"/>
<text x="840" y="318" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#67e8f9">751</text>
<text x="56" y="348" font-size="20" font-weight="400" class="" text-anchor="start" style="fill:#a5b6cc">Sunday</text>
<path d="M216,342 L730,342" fill="none" stroke="#2a4058" stroke-width="1" />
<circle cx="587.1462765957447" cy="342" r="6" fill="url(#sphere)" stroke="#b8f5ff" stroke-width="0.8" data-weekday="6" data-count="543" data-cap="752"/>
<text x="840" y="348" font-size="20" font-weight="400" class="" text-anchor="end" style="fill:#a5b6cc">543</text>
<text x="36" y="408" font-size="16" font-weight="400" class="mono" text-anchor="start" style="fill:#a5b6cc">ONE DOT PER WEEKDAY / CONTRIBUTIONS, NOT HOURS WORKED</text>
</svg>
