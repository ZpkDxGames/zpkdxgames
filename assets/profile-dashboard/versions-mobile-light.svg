<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 500"><title id="title">Stable version shelf</title><desc id="desc">Latest stable publication in the snapshot for the six featured systems; a dash is shown where no stable release appears in the selected window.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="498" height="498" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">STABLE VERSION SHELF</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">Latest stable publication present in the 90-day snapshot</text><rect x="22" y="90" width="224" height="108" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="34" y="116" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">PLEXONPANEL</text><text x="34" y="148" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#172033">v3.4.0</text><text x="34" y="172" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">2026-09-13</text><rect x="260" y="90" width="224" height="108" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="272" y="116" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">PLEXONTOOLS</text><text x="272" y="148" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#172033">v4.3.0</text><text x="272" y="172" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">2026-09-11</text><rect x="22" y="216" width="224" height="108" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="34" y="242" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">PLEXONQUESTS</text><text x="34" y="274" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#172033">v4.2.2</text><text x="34" y="298" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">2026-09-13</text><rect x="260" y="216" width="224" height="108" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="272" y="242" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">PLEXONCHATS</text><text x="272" y="274" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#172033">v4.0.1</text><text x="272" y="298" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">2026-09-13</text><rect x="22" y="342" width="224" height="108" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="34" y="368" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">PLEXONCORE</text><text x="34" y="400" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#172033">v2.1.0</text><text x="34" y="424" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">2026-09-17</text><rect x="260" y="342" width="224" height="108" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="272" y="368" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">AI-DESKTOP-COMPANION</text><text x="272" y="400" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#172033">—</text><text x="272" y="424" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">no stable publication</text></svg>