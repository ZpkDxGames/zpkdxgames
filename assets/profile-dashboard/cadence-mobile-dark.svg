<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 340"><title id="title">Release publication cadence</title><desc id="desc">Weekly published release counts split into stable releases and prereleases. Release publication is not represented as deployment.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="498" height="338" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#55DFC1">RELEASE CADENCE</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8C9AB0">Published releases by week · stable + prerelease · publication ≠ deployment</text><rect x="57.6" y="281.2" width="43.4" height="3.8" fill="#6EA8FF" class="bar-y"/><rect x="57.6" y="281.2" width="43.4" height="0.0" fill="#F2B866" class="bar-y"/><text x="79.3" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#8C9AB0">07-20</text><text x="79.3" y="275.2" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">3</text><rect x="127.6" y="283.7" width="43.4" height="1.3" fill="#6EA8FF" class="bar-y"/><rect x="127.6" y="283.7" width="43.4" height="0.0" fill="#F2B866" class="bar-y"/><text x="149.3" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#8C9AB0">08-10</text><text x="149.3" y="277.7" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">1</text><rect x="197.6" y="281.2" width="43.4" height="3.8" fill="#6EA8FF" class="bar-y"/><rect x="197.6" y="280.0" width="43.4" height="1.3" fill="#F2B866" class="bar-y"/><text x="219.3" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#8C9AB0">08-24</text><text x="219.3" y="274.0" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">4</text><rect x="267.6" y="253.5" width="43.4" height="31.5" fill="#6EA8FF" class="bar-y"/><rect x="267.6" y="249.7" width="43.4" height="3.8" fill="#F2B866" class="bar-y"/><text x="289.3" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#8C9AB0">08-31</text><text x="289.3" y="243.7" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">28</text><rect x="337.6" y="157.6" width="43.4" height="127.4" fill="#6EA8FF" class="bar-y"/><rect x="337.6" y="92.0" width="43.4" height="65.6" fill="#F2B866" class="bar-y"/><text x="359.3" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#8C9AB0">09-07</text><text x="359.3" y="86.0" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">153</text><rect x="407.6" y="281.2" width="43.4" height="3.8" fill="#6EA8FF" class="bar-y"/><rect x="407.6" y="281.2" width="43.4" height="0.0" fill="#F2B866" class="bar-y"/><text x="429.3" y="303" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#8C9AB0">09-14</text><text x="429.3" y="275.2" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">3</text><text x="45" y="320" font-family="ui-monospace,monospace" font-size="8" fill="#6EA8FF">■ stable</text><text x="121" y="320" font-family="ui-monospace,monospace" font-size="8" fill="#F2B866">■ prerelease</text></svg>