<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 290"><title id="title">Technology topology</title><desc id="desc">Verified technologies grouped by server runtime, web interface, desktop, and build/delivery surfaces without proficiency claims.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="998" height="288" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="42" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1" fill="#55DFC1">TECHNOLOGY TOPOLOGY</text><text x="28" y="65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#8C9AB0">Technologies grouped by verified use surface. No proficiency scores.</text><rect x="22" y="92" width="228" height="166" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="120" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">SERVER RUNTIME</text><text x="40" y="150" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• Java</text><text x="40" y="174" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• Paper</text><text x="40" y="198" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• SQLite</text><text x="40" y="222" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• MiniMessage</text><rect x="264" y="92" width="228" height="166" rx="12" fill="#151E2F" stroke="#263247"/><text x="278" y="120" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">WEB INTERFACES</text><text x="282" y="150" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• TypeScript</text><text x="282" y="174" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• JavaScript</text><text x="282" y="198" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• HTML</text><text x="282" y="222" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• CSS</text><text x="282" y="246" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• React/Vite</text><rect x="506" y="92" width="228" height="166" rx="12" fill="#151E2F" stroke="#263247"/><text x="520" y="120" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">DESKTOP</text><text x="524" y="150" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• Rust</text><text x="524" y="174" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• Tauri</text><text x="524" y="198" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• Three.js</text><text x="524" y="222" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• skinview3d</text><rect x="748" y="92" width="228" height="166" rx="12" fill="#151E2F" stroke="#263247"/><text x="762" y="120" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">BUILD / DELIVERY</text><text x="766" y="150" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• Gradle</text><text x="766" y="174" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• Maven</text><text x="766" y="198" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">• GitHub Actions</text></svg>