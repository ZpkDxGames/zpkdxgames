<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 470"><title id="title">Repository activity window board</title><desc id="desc">Repositories grouped by whether they have project-wide commits in the last 30 days, only in the 90-day window, or none in the window. This is not a health score.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="498" height="468" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">ACTIVITY WINDOW BOARD</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">Factual recency classes supported by the frozen snapshot; not repository health</text><rect x="22" y="88" width="456" height="116" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="36" y="112" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">ACTIVE IN 30D · 10</text><text x="36" y="137" font-family="ui-monospace,monospace" font-size="7.4" fill="#5D6B80">AI-Desktop-Companion, ConanGrayBot-Core, ConanGrayBot-Page</text><text x="36" y="155" font-family="ui-monospace,monospace" font-size="7.4" fill="#5D6B80">PlexonCore, PlexonKeys, PlexonPanel</text><text x="36" y="173" font-family="ui-monospace,monospace" font-size="7.4" fill="#5D6B80">+4 more</text><rect x="22" y="214" width="456" height="116" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="36" y="238" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">ACTIVITY IN 90D ONLY · 18</text><text x="36" y="263" font-family="ui-monospace,monospace" font-size="7.4" fill="#5D6B80">GhostBlocks, Plexon-DailyRewards, PlexonBackpacks</text><text x="36" y="281" font-family="ui-monospace,monospace" font-size="7.4" fill="#5D6B80">PlexonBlacksmith, PlexonChats, PlexonCrates</text><text x="36" y="299" font-family="ui-monospace,monospace" font-size="7.4" fill="#5D6B80">+12 more</text><rect x="22" y="340" width="456" height="82" rx="10" fill="#EEF2F8" stroke="#D3DBE8"/><text x="36" y="364" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">NO COMMITS IN 90D · 2</text><text x="36" y="389" font-family="ui-monospace,monospace" font-size="7.4" fill="#5D6B80">DropsEditor, Neural-Core-Dashboard</text></svg>