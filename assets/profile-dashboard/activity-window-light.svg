<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 310"><title id="title">Repository activity window board</title><desc id="desc">Repositories grouped by whether they have project-wide commits in the last 30 days, only in the 90-day window, or none in the window. This is not a health score.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="998" height="308" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">ACTIVITY WINDOW BOARD</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">Factual recency classes supported by the frozen snapshot; not repository health</text><rect x="24" y="90" width="300" height="190" rx="11" fill="#EEF2F8" stroke="#D3DBE8"/><text x="38" y="116" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">ACTIVE IN 30D · 10</text><text x="40" y="142" font-family="ui-monospace,monospace" font-size="8" fill="#172033">AI-Desktop-Companion</text><text x="40" y="160" font-family="ui-monospace,monospace" font-size="8" fill="#172033">ConanGrayBot-Core</text><text x="40" y="178" font-family="ui-monospace,monospace" font-size="8" fill="#172033">ConanGrayBot-Page</text><text x="40" y="196" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonCore</text><text x="40" y="214" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonKeys</text><text x="40" y="232" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonPanel</text><text x="40" y="250" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonPanel-Dashboard</text><text x="40" y="268" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">+3 more</text><rect x="342" y="90" width="300" height="190" rx="11" fill="#EEF2F8" stroke="#D3DBE8"/><text x="356" y="116" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">ACTIVITY IN 90D ONLY · 18</text><text x="358" y="142" font-family="ui-monospace,monospace" font-size="8" fill="#172033">GhostBlocks</text><text x="358" y="160" font-family="ui-monospace,monospace" font-size="8" fill="#172033">Plexon-DailyRewards</text><text x="358" y="178" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonBackpacks</text><text x="358" y="196" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonBlacksmith</text><text x="358" y="214" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonChats</text><text x="358" y="232" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonCrates</text><text x="358" y="250" font-family="ui-monospace,monospace" font-size="8" fill="#172033">PlexonGPFlags</text><text x="358" y="268" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">+11 more</text><rect x="660" y="90" width="300" height="190" rx="11" fill="#EEF2F8" stroke="#D3DBE8"/><text x="674" y="116" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">NO COMMITS IN 90D · 2</text><text x="676" y="142" font-family="ui-monospace,monospace" font-size="8" fill="#172033">DropsEditor</text><text x="676" y="160" font-family="ui-monospace,monospace" font-size="8" fill="#172033">Neural-Core-Dashboard</text></svg>