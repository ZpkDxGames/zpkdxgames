<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 360"><title id="title">Project window activity matrix</title><desc id="desc">Two bars per project compare exact 90-day and 30-day project-wide commit counts without presenting the difference as growth.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="998" height="358" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">WINDOW ACTIVITY MATRIX</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">90-day total vs 30-day recent activity · counts are not normalized as growth</text><text x="230" y="104.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonPanel</text><rect x="240" y="92.0" width="720.0" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="106.0" width="435.4" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="103.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">592 / 358</text><text x="230" y="134.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonPanel-Dashboard</text><rect x="240" y="122.0" width="707.8" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="136.0" width="391.6" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="133.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">582 / 322</text><text x="230" y="164.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonCrates</text><rect x="240" y="152.0" width="656.8" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="166.0" width="0.0" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="163.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">540 / 0</text><text x="230" y="194.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonQuests</text><rect x="240" y="182.0" width="367.3" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="196.0" width="0.0" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="193.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">302 / 0</text><text x="230" y="224.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonChats</text><rect x="240" y="212.0" width="315.0" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="226.0" width="0.0" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="223.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">259 / 0</text><text x="230" y="254.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonUtility</text><rect x="240" y="242.0" width="312.6" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="256.0" width="160.5" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="253.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">257 / 132</text><text x="230" y="284.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonSpawners</text><rect x="240" y="272.0" width="299.2" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="286.0" width="14.6" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="283.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">246 / 12</text><text x="230" y="314.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonTools</text><rect x="240" y="302.0" width="242.0" height="9" rx="3" fill="#2F68C7" opacity=".65" class="bar-x"/><rect x="240" y="316.0" width="0.0" height="9" rx="3" fill="#087D6B" class="bar-x"/><text x="960" y="313.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">199 / 0</text></svg>