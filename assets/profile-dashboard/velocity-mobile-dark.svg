<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 410"><title id="title">Project window activity matrix</title><desc id="desc">Two bars per project compare exact 90-day and 30-day project-wide commit counts without presenting the difference as growth.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="498" height="408" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#55DFC1">WINDOW ACTIVITY MATRIX</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8C9AB0">90-day total vs 30-day recent activity · counts are not normalized as growth</text><text x="165" y="104.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonPanel</text><rect x="175" y="92.0" width="285.0" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="106.0" width="172.3" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="103.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">592 / 358</text><text x="165" y="140.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonPanel-Dashboard</text><rect x="175" y="128.25" width="280.2" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="142.25" width="155.0" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="139.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">582 / 322</text><text x="165" y="176.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonCrates</text><rect x="175" y="164.5" width="260.0" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="178.5" width="0.0" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="175.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">540 / 0</text><text x="165" y="212.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonQuests</text><rect x="175" y="200.75" width="145.4" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="214.75" width="0.0" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="211.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">302 / 0</text><text x="165" y="249.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonChats</text><rect x="175" y="237.0" width="124.7" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="251.0" width="0.0" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="248.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">259 / 0</text><text x="165" y="285.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonUtility</text><rect x="175" y="273.25" width="123.7" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="287.25" width="63.5" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="284.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">257 / 132</text><text x="165" y="321.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonSpawners</text><rect x="175" y="309.5" width="118.4" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="323.5" width="5.8" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="320.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">246 / 12</text><text x="165" y="357.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonTools</text><rect x="175" y="345.75" width="95.8" height="9" rx="3" fill="#6EA8FF" opacity=".65" class="bar-x"/><rect x="175" y="359.75" width="0.0" height="9" rx="3" fill="#55DFC1" class="bar-x"/><text x="460" y="356.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">199 / 0</text></svg>