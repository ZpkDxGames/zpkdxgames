<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 430"><title id="title">Project activity leaderboard</title><desc id="desc">Horizontal bars ranking repositories by exact project-wide 90-day commit totals, with a secondary 30-day activity marker.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="998" height="428" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">PROJECT ACTIVITY</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">Top projects by project-wide commits in the same 90-day window</text><text x="240" y="102.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonPanel</text><rect x="250" y="92.0" width="700.0" height="14" rx="3" fill="#2F68C7" class="bar-x"/><rect x="250" y="109.0" width="423.3" height="4" rx="2" fill="#087D6B" class="bar-x"/><text x="955.0" y="103.0" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">592</text><text x="240" y="132.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonPanel-Dashboard</text><rect x="250" y="122.8" width="688.2" height="14" rx="3" fill="#2F68C7" class="bar-x"/><rect x="250" y="139.8" width="380.7" height="4" rx="2" fill="#087D6B" class="bar-x"/><text x="944.2" y="133.8" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">582</text><text x="240" y="163.6" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonCrates</text><rect x="250" y="153.6" width="638.5" height="14" rx="3" fill="#2F68C7" class="bar-x"/><rect x="250" y="170.6" width="0.0" height="4" rx="2" fill="#087D6B" class="bar-x"/><text x="894.5" y="164.6" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">540</text><text x="240" y="194.4" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonQuests</text><rect x="250" y="184.4" width