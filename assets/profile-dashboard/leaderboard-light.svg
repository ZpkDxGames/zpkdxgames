th="202.2" height="14" rx="3" fill="#2F68C7" class="bar-x"/><rect x="250" y="355.4" width="43.8" height="4" rx="2" fill="#087D6B" class="bar-x"/><text x="458.2" y="349.4" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">171</text><text x="240" y="379.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">PlexonCore</text><rect x="250" y="369.2" width="195.1" height="14" rx="3" fill="#2F68C7" class="bar-x"/><rect x="250" y="386.2" width="65.0" height="4" rx="2" fill="#087D6B" class="bar-x"/><text x="451.1" y="380.2" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">165</text><text x="250" y="412" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">main bar: 90d · lower marker: 30d · zero baseline</text></svg>