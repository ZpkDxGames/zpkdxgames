<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 150"><title id="title">Engineering status snapshot</title><desc id="desc">Compact status rail with six verified snapshot metrics.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="998" height="148" rx="16" fill="#FFFFFF" stroke="#D3DBE8"/><rect x="16" y="18" width="150" height="114" rx="10" fill="#EEF2F8" stroke="#D3DBE8" class="reveal" style="animation-delay:0ms"/><text x="28" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#172033">30</text><text x="28" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#5D6B80">PROJECTS</text><text x="28" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">public · owned</text><line x1="28" y1="114" x2="154" y2="114" stroke="#2F68C7" stroke-width="2" opacity=".5"/><rect x="178" y="18" width="150" height="114" rx="10" fill="#EEF2F8" stroke="#D3DBE8" class="reveal" style="animation-delay:70ms"/><text x="190" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#172033">4,419</text><text x="190" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#5D6B80">PROJECT COMMITS</text><text x="190" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">90 UTC days</text><line x1="190" y1="114" x2="316" y2="114" stroke="#2F68C7" stroke-width="2" opacity=".5"/><rect x="340" y="18" width="150" height="114" rx="10" fill="#EEF2F8" stroke="#D3DBE8" class="reveal" style="animation-delay:140ms"/><text x="352" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#172033">10</text><text x="352" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#5D6B80">ACTIVE PROJECTS</text><text x="352" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">last 30d</text><line x1="352" y1="114" x2="478" y2="114" stroke="#2F68C7" stroke-width="2" opacity=".5"/><rect x="502" y="18" width="150" height="114" rx="10" fill="#EEF2F8" stroke="#D3DBE8" class="reveal" style="animation-delay:210ms"/><text x="514" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#172033">192</text><text x="514" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#5D6B80">PUBLICATIONS</text><text x="514" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">90d</text><line x1="514" y1="114" x2="640" y2="114" stroke="#2F68C7" stroke-width="2" opacity=".5"/><rect x="664" y="18" width="150" height="114" rx="10" fill="#EEF2F8" stroke="#D3DBE8" class="reveal" style="animation-delay:280ms"/><text x="676" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#172033">11.0M</text><text x="676" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#5D6B80">SOURCE BYTES</text><text x="676" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">default branches</text><line x1="676" y1="114" x2="802" y2="114" stroke="#2F68C7" stroke-width="2" opacity=".5"/><rect x="826" y="18" width="150" height="114" rx="10" fill="#EEF2F8" stroke="#D3DBE8" class="reveal" style="animation-delay:350ms"/><text x="838" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#172033">24d</text><text x="838" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#5D6B80">LATEST PUBLICATION</text><text x="838" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">snapshot age</text><line x1="838" y1="114" x2="964" y2="114" stroke="#2F68C7" stroke-width="2" opacity=".5"/></svg>