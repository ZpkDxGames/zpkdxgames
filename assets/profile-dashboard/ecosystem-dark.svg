y="340" width="232" height="228" rx="12" fill="#151E2F" stroke="#263247"/><text x="278" y="366" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">ECONOMY / JOBS</text><circle cx="282" cy="384" r="3" fill="#E8EEF8"/><text x="292" y="388" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonJobs</text><circle cx="282" cy="411" r="3" fill="#E8EEF8"/><text x="292" y="415" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonShops</text><rect x="508" y="340" width="232" height="228" rx="12" fill="#151E2F" stroke="#263247"/><text x="522" y="366" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">WORLD / TRAVEL</text><circle cx="526" cy="384" r="3" fill="#E8EEF8"/><text x="536" y="388" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonHomes</text><circle cx="526" cy="411" r="3" fill="#E8EEF8"/><text x="536" y="415" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonTravel</text><rect x="752" y="340" width="232" height="228" rx="12" fill="#151E2F" stroke="#263247"/><text x="766" y="366" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">CLAIM POLICY</text><circle cx="770" cy="384" r="3" fill="#E8EEF8"/><text x="780" y="388" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonGPFlags</text><circle cx="770" cy="411" r="3" fill="#E47C8C"/><text x="780" y="415" font-family="ui-monospace,monospace" font-size="9" fill="#E47C8C">PlexonGriefPreventionAddon · historical</text></svg>