<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 620"><title id="title">Plexon ecosystem topology</title><desc id="desc">Organizational grouping of public Plexon repositories by responsibility. Groups do not assert dependency edges; deprecated or retired projects are differentiated.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="998" height="618" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="42" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1" fill="#55DFC1">PLEXON ECOSYSTEM · ORGANIZATIONAL OVERVIEW</text><text x="28" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#8C9AB0">Grouped by responsibility. Containment is not a dependency assertion.</text><rect x="20" y="92" width="232" height="228" rx="12" fill="#151E2F" stroke="#263247"/><text x="34" y="118" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">RUNTIME / SHARED</text><circle cx="38" cy="136" r="3" fill="#E8EEF8"/><text x="48" y="140" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonCore</text><circle cx="38" cy="163" r="3" fill="#E8EEF8"/><text x="48" y="167" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonUtility</text><rect x="264" y="92" width="232" height="228" rx="12" fill="#151E2F" stroke="#263247"/><text x="278" y="118" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">OPERATIONS</text><circle cx="282" cy="136" r="3" fill="#E8EEF8"/><text x="292" y="140" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonPanel</text><circle cx="282" cy="163" r="3" fill="#E8EEF8"/><text x="292" y="167" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonPanel-Dashboard</text><rect x="508" y="92" width="232" height="228" rx="12" fill="#151E2F" stroke="#263247"/><text x="522" y="118" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">PROGRESSION</text><circle cx="526" cy="136" r="3" fill="#E8EEF8"/><text x="536" y="140" font-family="ui-monospace,monospace" font-size="9" fill="#E8EE