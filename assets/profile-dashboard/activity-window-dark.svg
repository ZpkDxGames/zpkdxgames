<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 310"><title id="title">Repository activity window board</title><desc id="desc">Repositories grouped by whether they have project-wide commits in the last 30 days, only in the 90-day window, or none in the window. This is not a health score.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="998" height="308" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#55DFC1">ACTIVITY WINDOW BOARD</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8C9AB0">Factual recency classes supported by the frozen snapshot; not repository health</text><rect x="24" y="90" width="300" height="190" rx="11" fill="#151E2F" stroke="#263247"/><text x="38" y="116" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">ACTIVE IN 30D · 10</text><text x="40" y="142" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">AI-Desktop-Companion</text><text x="40" y="160" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">ConanGrayBot-Core</text><text x="40" y="178" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">ConanGrayBot-Page</text><text x="40" y="196" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonCore</text><text x="40" y="214" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonKeys</text><text x="40" y="232" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonPanel</text><text x="40" y="250" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonPanel-Dashboard</text><text x="40" y="268" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">+3 more</text><rect x="342" y="90" width="300" height="190" rx="11" fill="#151E2F" stroke="#263247"/><text x="356" y="116" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">ACTIVITY IN 90D ONLY · 18</text><text x="358" y="142" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">GhostBlocks</text><text x="358" y="160" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">Plexon-DailyRewards</text><text x="358" y="178" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonBackpacks</text><text x="358" y="196" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonBlacksmith</text><text x="358" y="214" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonChats</text><text x="358" y="232" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonCrates</text><text x="358" y="250" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">PlexonGPFlags</text><text x="358" y="268" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">+11 more</text><rect x="660" y="90" width="300" height="190" rx="11" fill="#151E2F" stroke="#263247"/><text x="674" y="116" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">NO COMMITS IN 90D · 2</text><text x="676" y="142" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">DropsEditor</text><text x="676" y="160" font-family="ui-monospace,monospace" font-size="8" fill="#E8EEF8">Neural-Core-Dashboard</text></svg>