<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 390"><title id="title">Project activity leaderboard</title><desc id="desc">Horizontal bars ranking repositories by exact project-wide 90-day commit totals, with a secondary 30-day activity marker.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="498" height="388" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#55DFC1">PROJECT ACTIVITY</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8C9AB0">Top projects by project-wide commits in the same 90-day window</text><text x="160" y="102.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonPanel</text><rect x="170" y="92.0" width="280.0" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="109.0" width="169.3" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="455.0" y="103.0" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">592</text><text x="160" y="135.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonPanel-Dashboard</text><rect x="170" y="125.5" width="275.3" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="142.5" width="152.3" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="451.3" y="136.5" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">582</text><text x="160" y="169.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonCrates</text><rect x="170" y="159.0" width="255.4" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="176.0" width="0.0" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="431.4" y="170.0" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">540</text><text x="160" y="202.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonQuests</text><rect x="170" y="192.5" width="142.8" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="209.5" width="0.0" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="318.8" y="203.5" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">302</text><text x="160" y="236.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonChats</text><rect x="170" y="226.0" width="122.5" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="243.0" width="0.0" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="298.5" y="237.0" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">259</text><text x="160" y="269.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonUtility</text><rect x="170" y="259.5" width="121.6" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="276.5" width="62.4" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="297.6" y="270.5" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">257</text><text x="160" y="303.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonSpawners</text><rect x="170" y="293.0" width="116.4" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="310.0" width="5.7" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="292.4" y="304.0" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">246</text><text x="160" y="336.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">PlexonTools</text><rect x="170" y="326.5" width="94.1" height="14" rx="3" fill="#6EA8FF" class="bar-x"/><rect x="170" y="343.5" width="0.0" height="4" rx="2" fill="#55DFC1" class="bar-x"/><text x="270.1" y="337.5" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">199</text><text x="170" y="372" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">main bar: 90d · lower marker: 30d · zero baseline</text></svg>