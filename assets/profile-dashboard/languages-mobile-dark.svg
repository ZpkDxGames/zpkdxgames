<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 380"><title id="title">Language source volume</title><desc id="desc">Repository language byte totals from GitHub Linguist on default branches. The chart measures source volume, not skill or proficiency.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="498" height="378" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#55DFC1">LANGUAGE VOLUME</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8C9AB0">Default-branch GitHub Linguist bytes · source volume, not proficiency</text><text x="140" y="104.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">Java</text><rect x="150" y="92.0" width="304.0" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="104.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">9,606,182 B · 87.2%</text><text x="140" y="136.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">Python</text><rect x="150" y="124.25" width="16.1" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="136.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">507,336 B · 4.6%</text><text x="140" y="168.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">TypeScript</text><rect x="150" y="156.5" width="11.6" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="168.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">366,409 B · 3.3%</text><text x="140" y="200.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">JavaScript</text><rect x="150" y="188.75" width="8.3" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="200.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">262,514 B · 2.4%</text><text x="140" y="233.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">CSS</text><rect x="150" y="221.0" width="4.2" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="233.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">132,992 B · 1.2%</text><text x="140" y="265.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">HTML</text><rect x="150" y="253.25" width="4.1" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="265.2" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">129,201 B · 1.2%</text><text x="140" y="297.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">Shell</text><rect x="150" y="285.5" width="0.3" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="297.5" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">7,969 B · 0.1%</text><text x="140" y="329.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#E8EEF8">Other</text><rect x="150" y="317.75" width="0.2" height="14" rx="3" fill="#55DFC1" class="bar-x"/><text x="454" y="329.8" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">5,497 B · 0.0%</text></svg>