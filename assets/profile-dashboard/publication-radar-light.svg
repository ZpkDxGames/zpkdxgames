<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 335"><title id="title">Recent publication radar</title><desc id="desc">Recent published releases positioned in snapshot order. Stable releases use circles and prereleases use diamonds, so meaning is not encoded by color alone.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="998" height="333" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">PUBLICATION RADAR</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">Ten most recent published releases in the snapshot · stable and prerelease use shape + color</text><line x1="40" y1="100" x2="960" y2="100" stroke="#D3DBE8" stroke-width="2"/><circle cx="40.0" cy="100" r="5" fill="#087D6B"/><line x1="40.0" y1="100" x2="40.0" y2="200" stroke="#E4E9F1"/><text x="40.0" y="216" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.3" fill="#172033">PlexonSpawners</text><text x="40.0" y="229" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#5D6B80">v4.0.0</text><circle cx="142.2" cy="100" r="5" fill="#087D6B"/><line x1="142.2" y1="100" x2="142.2" y2="232" stroke="#E4E9F1"/><text x="142.2" y="248" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.3" fill="#172033">PlexonUtility</text><text x="142.2" y="261" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#5D6B80">v3.5.0</text><circle cx="244.4" cy="100" r="5" fill="#087D6B"/><line x1="244.4" y1="100" x2="244.4" y2="264" stroke="#E4E9F1"/><text x="244.4" y="280" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.3" fill="#172033">PlexonCore</text><text x="244.4" y="293" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#5D6B80">v2.1.0</text><circle cx="346.7" cy="100" r="5" fill="#087D6B"/><line x1="346.7" y1="100" x2="346.7" y2="200" stroke="#E4E9F1"/><text x="346.7" y="216" text-anchor="mid