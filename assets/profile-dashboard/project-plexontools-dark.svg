<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 390"><title id="title">PlexonTools · system module</title><desc id="desc">Featured repository dashboard for PlexonTools, showing verified 90-day and 30-day project-wide commit totals, latest stable publication from the snapshot, source language, and a conceptual technical preview.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="998" height="388" rx="18" fill="#0E1420" stroke="#263247"/><rect x="20" y="18" width="6" height="62" rx="3" fill="#6EA8FF" class="signal"/><text x="40" y="42" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.2" fill="#8C9AB0">PROGRESSION ENGINE</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="29" font-weight="750" fill="#E8EEF8">PlexonTools</text><rect x="760" y="30" width="216" height="28" rx="14" fill="#151E2F" stroke="#263247"/><text x="772" y="49" font-family="ui-monospace,monospace" font-size="10" fill="#55DFC1">STABLE LINE</text><text x="40" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#8C9AB0">Persistent tool identity and progression with in-memory authority, event contracts, natural-block provenance,</text><text x="40" y="128" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#8C9AB0">and bounded asynchronous SQLite persistence.</text><rect x="28" y="145" width="220" height="62" rx="10" fill="#151E2F" stroke="#263247"/><text x="40" y="171" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#E8EEF8">199</text><text x="40" y="188" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PROJECT COMMITS</text><text x="238" y="188" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">90 UTC days</text><rect x="263" y="145" width="220" height="62" rx="10" fill="#151E2F" stroke="#263247"/><text x="275" y="171" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#E8EEF8">0</text><text x="275" y="188" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PROJECT COMMITS</text><text x="473" y="188" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">30 UTC days</text><rect x="498" y="145" width="220" height="62" rx="10" fill="#151E2F" stroke="#263247"/><text x="510" y="171" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#E8EEF8">v4.3.0</text><text x="510" y="188" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">STABLE PUBLICATION</text><text x="708" y="188" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">2026-09-11</text><rect x="733" y="145" width="220" height="62" rx="10" fill="#151E2F" stroke="#263247"/><text x="745" y="171" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#E8EEF8">Java</text><text x="745" y="188" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PRIMARY LANGUAGE</text><text x="943" y="188" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">by source bytes</text><polyline points="730.0,134.0 732.6,134.0 735.2,134.0 737.8,134.0 740.3,134.0 742.9,134.0 745.5,134.0 748.1,134.0 750.7,134.0 753.3,134.0 755.8,134.0 758.4,134.0 761.0,134.0 763.6,134.0 766.2,134.0 768.8,134.0 771.3,134.0 773.9,134.0 776.5,134.0 779.1,134.0 781.7,134.0 784.3,134.0 786.9,134.0 789.4,134.0 792.0,134.0 794.6,134.0 797.2,134.0 799.8,134.0 802.4,134.0 804.9,134.0 807.5,134.0 810.1,134.0 812.7,134.0 815.3,134.0 817.9,134.0 820.4,134.0 823.0,134.0 825.6,134.0 828.2,134.0 830.8,134.0 833.4,134.0 836.0,134.0 838.5,134.0 841.1,132.2 843.7,131.2 846.3,132.2 848.9,132.6 851.5,134.0 854.0,134.0 856.6,134.0 859.2,134.0 861.8,134.0 864.4,134.0 867.0,119.3 869.6,120.7 872.1,112.0 874.7,126.2 877.3,125.3 879.9,134.0 882.5,134.0 885.1,134.0 887.6,134.0 890.2,134.0 892.8,134.0 895.4,134.0 898.0,134.0 900.6,134.0 903.1,134.0 905.7,134.0 908.3,134.0 910.9,134.0 913.5,134.0 916