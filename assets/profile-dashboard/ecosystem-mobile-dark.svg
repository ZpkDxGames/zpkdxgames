<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 1294"><title id="title">Plexon ecosystem topology</title><desc id="desc">Organizational grouping of public Plexon repositories by responsibility. Groups do not assert dependency edges; deprecated or retired projects are differentiated.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="498" height="1292" rx="18" fill="#0E1420" stroke="#263247"/><text x="28" y="42" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1" fill="#55DFC1">PLEXON ECOSYSTEM · ORGANIZATIONAL OVERVIEW</text><text x="28" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#8C9AB0">Grouped by responsibility. Containment is not a dependency assertion.</text><rect x="22" y="92" width="456" height="114" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="116" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">RUNTIME / SHARED</text><text x="42" y="151" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonCore</text><text x="42" y="185" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonUtility</text><rect x="22" y="218" width="456" height="114" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="242" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">OPERATIONS</text><text x="42" y="277" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonPanel</text><text x="42" y="311" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonPanel-Dashboard</text><rect x="22" y="344" width="456" height="182" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="368" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">PROGRESSION</text><text x="42" y="403" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonTools</text><text x="42" y="437" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonQuests</text><text x="42" y="471" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonRanks</text><text x="42" y="505" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonSkills</text><rect x="22" y="538" width="456" height="250" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="562" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">REWARDS / ITEMS</text><text x="42" y="597" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">Plexon-DailyRewards</text><text x="42" y="631" font-family="ui-monospace,monospace" font-size="10" fill="#E47C8C">PlexonCrates · HISTORICAL</text><text x="42" y="665" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonKeys</text><text x="42" y="699" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonSpawners</text><text x="42" y="733" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonBackpacks</text><text x="42" y="767" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonBlacksmith</text><rect x="22" y="800" width="456" height="80" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="824" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">COMMUNICATION</text><text x="42" y="859" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonChats</text><rect x="22" y="892" width="456" height="114" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="916" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">ECONOMY / JOBS</text><text x="42" y="951" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonJobs</text><text x="42" y="985" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonShops</text><rect x="22" y="1018" width="456" height="114" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="1042" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">WORLD / TRAVEL</text><text x="42" y="1077" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonHomes</text><text x="42" y="1111" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonTravel</text><rect x="22" y="1144" width="456" height="114" rx="12" fill="#151E2F" stroke="#263247"/><text x="36" y="1168" font-family="ui-monospace,monospace" font-size="9" fill="#F2B866">CLAIM POLICY</text><text x="42" y="1203" font-family="ui-monospace,monospace" font-size="10" fill="#E8EEF8">PlexonGPFlags</text><text x="42" y="1237" font-family="ui-monospace,monospace" font-size="10" fill="#E47C8C">PlexonGriefPreventionAddon · HISTORICAL</text></svg>