<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 330"><title id="title">Language source volume</title><desc id="desc">Repository language byte totals from GitHub Linguist on default branches. The chart measures source volume, not skill or proficiency.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="998" height="328" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">LANGUAGE VOLUME</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">Default-branch GitHub Linguist bytes · source volume, not proficiency</text><text x="200" y="104.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">Java</text><rect x="210" y="92.0" width="744.0" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="104.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">9,606,182 B · 87.2%</text><text x="200" y="130.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">Python</text><rect x="210" y="118.0" width="39.3" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="130.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">507,336 B · 4.6%</text><text x="200" y="156.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">TypeScript</text><rect x="210" y="144.0" width="28.4" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="156.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">366,409 B · 3.3%</text><text x="200" y="182.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">JavaScript</text><rect x="210" y="170.0" width="20.3" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="182.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">262,514 B · 2.4%</text><text x="200" y="208.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">CSS</text><rect x="210" y="196.0" width="10.3" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="208.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">132,992 B · 1.2%</text><text x="200" y="234.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">HTML</text><rect x="210" y="222.0" width="10.0" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="234.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">129,201 B · 1.2%</text><text x="200" y="260.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">Shell</text><rect x="210" y="248.0" width="0.6" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="260.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">7,969 B · 0.1%</text><text x="200" y="286.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#172033">Other</text><rect x="210" y="274.0" width="0.4" height="14" rx="3" fill="#087D6B" class="bar-x"/><text x="954" y="286.0" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">5,497 B · 0.0%</text></svg>