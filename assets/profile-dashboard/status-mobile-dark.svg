<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 320"><title id="title">Engineering status snapshot</title><desc id="desc">Compact status rail with six verified snapshot metrics.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#8C9AB0}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E8EEF8}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#8C9AB0}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#E8EEF8}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#080B12}.panel{fill:#0E1420;stroke:#263247;stroke-width:1}.raised{fill:#151E2F;stroke:#263247;stroke-width:1}.grid{stroke:#182235;stroke-width:1}.p{fill:#6EA8FF}.s{fill:#55DFC1}.h{fill:#F2B866}.d{fill:#E47C8C}</style><rect x="1" y="1" width="498" height="318" rx="16" fill="#0E1420" stroke="#263247"/><rect x="18" y="18" width="224" height="82" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:0ms"/><text x="30" y="47" font-family="ui-monospace,monospace" font-size="21" font-weight="700" fill="#E8EEF8">30</text><text x="30" y="68" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PROJECTS</text><text x="230" y="86" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">public · owned</text><rect x="258" y="18" width="224" height="82" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:70ms"/><text x="270" y="47" font-family="ui-monospace,monospace" font-size="21" font-weight="700" fill="#E8EEF8">4,419</text><text x="270" y="68" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PROJECT COMMITS</text><text x="470" y="86" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">90 UTC days</text><rect x="18" y="114" width="224" height="82" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:140ms"/><text x="30" y="143" font-family="ui-monospace,monospace" font-size="21" font-weight="700" fill="#E8EEF8">10</text><text x="30" y="164" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">ACTIVE PROJECTS</text><text x="230" y="182" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">last 30d</text><rect x="258" y="114" width="224" height="82" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:210ms"/><text x="270" y="143" font-family="ui-monospace,monospace" font-size="21" font-weight="700" fill="#E8EEF8">192</text><text x="270" y="164" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PUBLICATIONS</text><text x="470" y="182" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">90d</text><rect x="18" y="210" width="224" height="82" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:280ms"/><text x="30" y="239" font-family="ui-monospace,monospace" font-size="21" font-weight="700" fill="#E8EEF8">11.0M</text><text x="30" y="260" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">SOURCE BYTES</text><text x="230" y="278" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">default branches</text><rect x="258" y="210" width="224" height="82" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:350ms"/><text x="270" y="239" font-family="ui-monospace,monospace" font-size="21" font-weight="700" fill="#E8EEF8">24d</text><text x="270" y="260" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">LATEST PUBLICATION</text><text x="470" y="278" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">snapshot age</text></svg>