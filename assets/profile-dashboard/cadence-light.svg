<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 310"><title id="title">Release publication cadence</title><desc id="desc">Weekly published release counts split into stable releases and prereleases. Release publication is not represented as deployment.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="998" height="308" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="40" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.1" fill="#087D6B">RELEASE CADENCE</text><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#5D6B80">Published releases by week · stable + prerelease · publication ≠ deployment</text><rect x="96.8" y="251.8" width="92.5" height="3.2" fill="#2F68C7" class="bar-y"/><rect x="96.8" y="251.8" width="92.5" height="0.0" fill="#92601D" class="bar-y"/><text x="143.1" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">07-20</text><text x="143.1" y="245.8" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#172033">3</text><rect x="246.0" y="253.9" width="92.5" height="1.1" fill="#2F68C7" class="bar-y"/><rect x="246.0" y="253.9" width="92.5" height="0.0" fill="#92601D" class="bar-y"/><text x="292.3" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">08-10</text><text x="292.3" y="247.9" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#172033">1</text><rect x="395.2" y="251.8" width="92.5" height="3.2" fill="#2F68C7" class="bar-y"/><rect x="395.2" y="250.7" width="92.5" height="1.1" fill="#92601D" class="bar-y"/><text x="441.4" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">08-24</text><text x="441.4" y="244.7" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#172033">4</text><rect x="544.4" y="228.4" width="92.5" height="26.6" fill="#2F68C7" class="bar-y"/><rect x="544.4" y="225.2" width="92.5" height="3.2" fill="#92601D" class="bar-y"/><text x="590.6" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">08-31</text><text x="590.6" y="219.2" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#172033">28</text><rect x="693.5" y="147.4" width="92.5" height="107.6" fill="#2F68C7" class="bar-y"/><rect x="693.5" y="92.0" width="92.5" height="55.4" fill="#92601D" class="bar-y"/><text x="739.8" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">09-07</text><text x="739.8" y="86.0" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#172033">153</text><rect x="842.7" y="251.8" width="92.5" height="3.2" fill="#2F68C7" class="bar-y"/><rect x="842.7" y="251.8" width="92.5" height="0.0" fill="#92601D" class="bar-y"/><text x="888.9" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5D6B80">09-14</text><text x="888.9" y="245.8" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#172033">3</text><text x="70" y="290" font-family="ui-monospace,monospace" font-size="8" fill="#2F68C7">■ stable</text><text x="146" y="290" font-family="ui-monospace,monospace" font-size="8" fill="#92601D">■ prerelease</text></svg>