h="2" opacity=".5"/><rect x="502" y="18" width="150" height="114" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:210ms"/><text x="514" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#E8EEF8">192</text><text x="514" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PUBLICATIONS</text><text x="514" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">90d</text><line x1="514" y1="114" x2="640" y2="114" stroke="#6EA8FF" stroke-width="2" opacity=".5"/><rect x="664" y="18" width="150" height="114" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:280ms"/><text x="676" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#E8EEF8">11.0M</text><text x="676" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">SOURCE BYTES</text><text x="676" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">default branches</text><line x1="676" y1="114" x2="802" y2="114" stroke="#6EA8FF" stroke-width="2" opacity=".5"/><rect x="826" y="18" width="150" height="114" rx="10" fill="#151E2F" stroke="#263247" class="reveal" style="animation-delay:350ms"/><text x="838" y="54" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#E8EEF8">24d</text><text x="838" y="79" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">LATEST PUBLICATION</text><text x="838" y="102" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">snapshot age</text><line x1="838" y1="114" x2="964" y2="114" stroke="#6EA8FF" stroke-width="2" opacity=".5"/></svg>