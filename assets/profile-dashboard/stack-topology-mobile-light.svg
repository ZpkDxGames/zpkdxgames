<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 500 510"><title id="title">Technology topology</title><desc id="desc">Verified technologies grouped by server runtime, web interface, desktop, and build/delivery surfaces without proficiency claims.</desc><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;letter-spacing:1.1px;fill:#5D6B80}.body{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#5D6B80}.value{font:700 30px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;fill:#172033}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-36}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.reveal{opacity:0;animation:reveal 900ms cubic-bezier(.22,1,.36,1) forwards}
.bar-x{transform-box:fill-box;transform-origin:left;animation:growX 1200ms cubic-bezier(.22,1,.36,1) forwards}
.bar-y{transform-box:fill-box;transform-origin:bottom;animation:growY 1200ms cubic-bezier(.22,1,.36,1) forwards}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1200ms cubic-bezier(.22,1,.36,1) forwards}
.flow{stroke-dasharray:8 10;animation:flow 24000ms linear infinite}
.signal{animation:breathe 24000ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
 .reveal,.bar-x,.bar-y,.trace,.flow,.signal{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
svg{background:#F5F7FB}.panel{fill:#FFFFFF;stroke:#D3DBE8;stroke-width:1}.raised{fill:#EEF2F8;stroke:#D3DBE8;stroke-width:1}.grid{stroke:#E4E9F1;stroke-width:1}.p{fill:#2F68C7}.s{fill:#087D6B}.h{fill:#92601D}.d{fill:#A94759}</style><rect x="1" y="1" width="498" height="508" rx="18" fill="#FFFFFF" stroke="#D3DBE8"/><text x="28" y="42" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1" fill="#087D6B">TECHNOLOGY TOPOLOGY</text><text x="28" y="65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#5D6B80">Technologies grouped by verified use surface. No proficiency scores.</text><rect x="22" y="90" width="456" height="88" rx="12" fill="#EEF2F8" stroke="#D3DBE8"/><text x="36" y="115" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">SERVER RUNTIME</text><text x="36" y="142" font-family="ui-monospace,monospace" font-size="10" fill="#172033">Java · Paper · SQLite · MiniMessage</text><rect x="22" y="190" width="456" height="88" rx="12" fill="#EEF2F8" stroke="#D3DBE8"/><text x="36" y="215" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">WEB INTERFACES</text><text x="36" y="242" font-family="ui-monospace,monospace" font-size="10" fill="#172033">TypeScript · JavaScript · HTML · CSS · React/Vite</text><rect x="22" y="290" width="456" height="88" rx="12" fill="#EEF2F8" stroke="#D3DBE8"/><text x="36" y="315" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">DESKTOP</text><text x="36" y="342" font-family="ui-monospace,monospace" font-size="10" fill="#172033">Rust · Tauri · Three.js · skinview3d</text><rect x="22" y="390" width="456" height="88" rx="12" fill="#EEF2F8" stroke="#D3DBE8"/><text x="36" y="415" font-family="ui-monospace,monospace" font-size="9" fill="#92601D">BUILD / DELIVERY</text><text x="36" y="442" font-family="ui-monospace,monospace" font-size="10" fill="#172033">Gradle · Maven · GitHub Actions</text></svg>