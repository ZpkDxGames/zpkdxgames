8EEF8">0</text><text x="268" y="216" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PROJECT COMMITS</text><text x="268" y="230" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">30 UTC days</text><rect x="24" y="250" width="220" height="68" rx="10" fill="#151E2F" stroke="#263247"/><text x="36" y="276" font-family="ui-monospace,monospace" font-size="19" font-weight="700" fill="#E8EEF8">v4.2.2</text><text x="36" y="294" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">STABLE PUBLICATION</text><text x="36" y="308" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">2026-09-13</text><rect x="256" y="250" width="220" height="68" rx="10" fill="#151E2F" stroke="#263247"/><text x="268" y="276" font-family="ui-monospace,monospace" font-size="19" font-weight="700" fill="#E8EEF8">Java</text><text x="268" y="294" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8" fill="#8C9AB0">PRIMARY LANGUAGE</text><text x="268" y="308" font-family="ui-monospace,monospace" font-size="8" fill="#8C9AB0">by source bytes</text><g transform="translate(0,118)"><rect x="24" y="210" width="452" height="210" rx="12" fill="#080B12" stroke="#263247"/><text x="40" y="230" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#8C9AB0">SYSTEM PREVIEW · CONCEPTUAL</text><rect x="46" y="245" width="408" height="40" rx="8" fill="#151E2F" stroke="#263247"/><text x="58" y="267" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#E8EEF8">AVAILABLE</text><text x="58" y="284" font-family="ui-monospace,monospace" font-size="9" fill="#8C9AB0">daily / weekly / milestone</text><path d="M250.0 285 L250.0 294" fill="none" stroke="#6EA8FF" stroke-width="2" class="flow" style="animation-delay:0ms" opacity=".8"/><rect x="46" y="294" width="408" height="40" rx="8" fill="#151E2F" stroke="#263247"/><text x="58" y="316" font-family="ui-monospace,monospace" 