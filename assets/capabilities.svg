<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" width="760" height="690" role="img" aria-label="Engineering capabilities">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101625"/><stop offset="1" stop-color="#080B12"/></linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B7CFF"/><stop offset="0.52" stop-color="#54D8E8"/><stop offset="1" stop-color="#67E8A5"/></linearGradient>
  <linearGradient id="cubeA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9B8FFF"/><stop offset="1" stop-color="#5E51D8"/></linearGradient>
  <linearGradient id="cubeB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70E6F0"/><stop offset="1" stop-color="#198CA0"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .eyebrow{font-size:18px;font-weight:700;letter-spacing:1.8px}
  .title{font-size:42px;font-weight:760;letter-spacing:-1.2px}
  .section{font-size:30px;font-weight:740;letter-spacing:-.5px}
  .card-title{font-size:26px;font-weight:720}
  .body{font-size:21px;font-weight:450}
  .small{font-size:18px;font-weight:650;letter-spacing:.8px}
  .metric{font-size:44px;font-weight:760;letter-spacing:-1px}
  .float{animation:float 6s ease-in-out infinite;transform-origin:center}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .dash{stroke-dasharray:10 12;animation:dash 10s linear infinite}
  .bar{transform-box:fill-box;transform-origin:center bottom;animation:rise .85s cubic-bezier(.2,.75,.3,1) both}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-220}}
  @keyframes rise{from{transform:scaleY(.08);opacity:.2}to{transform:scaleY(1);opacity:1}}
  @media(prefers-reduced-motion:reduce){.float,.pulse,.dash,.bar{animation:none!important}}
</style>
<rect x="1" y="1" width="758" height="688" rx="28" fill="url(#bg)" stroke="#26334A"/><path d="M30 662H730" stroke="#26334A" stroke-width="2"/><path d="M30 662H280" stroke="url(#signal)" stroke-width="3" class="dash"/><text x="42" y="58" class="eyebrow" fill="#8B7CFF">CAPABILITY MAP</text><text x="42" y="99" class="section" fill="#F4F7FB">From player interaction</text><text x="42" y="134" class="section" fill="#F4F7FB">to production recovery</text><rect x="42" y="160" width="676" height="132" rx="22" fill="#141D2E" stroke="#26334A"/><rect x="42" y="160" width="7" height="132" rx="3.5" fill="#8B7CFF"/><rect x="66" y="184" width="52" height="52" rx="16" fill="#8B7CFF" opacity=".14" stroke="#8B7CFF"/><text x="92" y="219" text-anchor="middle" class="small" fill="#8B7CFF">01</text><text x="138" y="203" class="card-title" fill="#F4F7FB">Gameplay systems</text><text x="138" y="230" class="body" fill="#A9B4C8">Native-feeling mechanics built around explicit</text><text x="138" y="256" class="body" fill="#A9B4C8">events, state, and player feedback.</text><text x="694" y="281" text-anchor="end" class="small" fill="#8B7CFF">PAPER · SPIGOT · JAVA</text><rect x="42" y="314" width="676" height="132" rx="22" fill="#141D2E" stroke="#26334A"/><rect x="42" y="314" width="7" height="132" rx="3.5" fill="#54D8E8"/><rect x="66" y="338" width="52" height="52" rx="16" fill="#54D8E8" opacity=".14" stroke="#54D8E8"/><text x="92" y="373" text-anchor="middle" class="small" fill="#54D8E8">02</text><text x="138" y="357" class="card-title" fill="#F4F7FB">Runtime &amp; data</text><text x="138" y="384" class="body" fill="#A9B4C8">Predictable persistence, bounded async work, APIs,</text><text x="138" y="410" class="body" fill="#A9B4C8">and clear ownership boundaries.</text><text x="694" y="435" text-anchor="end" class="small" fill="#54D8E8">SQL · REST · WEBSOCKET</text><rect x="42" y="468" width="676" height="132" rx="22" fill="#141D2E" stroke="#26334A"/><rect x="42" y="468" width="7" height="132" rx="3.5" fill="#67E8A5"/><rect x="66" y="492" width="52" height="52" rx="16" fill="#67E8A5" opacity=".14" stroke="#67E8A5"/><text x="92" y="527" text-anchor="middle" class="small" fill="#67E8A5">03</text><text x="138" y="511" class="card-title" fill="#F4F7FB">Operations</text><text x="138" y="538" class="body" fill="#A9B4C8">Telemetry, secure control planes, automation,</text><text x="138" y="564" class="body" fill="#A9B4C8">recovery, and deliberate delivery.</text><text x="694" y="589" text-anchor="end" class="small" fill="#67E8A5">LINUX · CI/CD · OBSERVABILITY</text><path d="M92 236V314M92 390V468" stroke="url(#signal)" stroke-width="3" class="dash"/><text x="42" y="662" class="small" fill="#69758A">CLEAR STATE · NARROW OWNERSHIP · USEFUL DIAGNOSTICS</text></svg>